{ group:'Getting started', n:6, title:'Reading the interface', steps:[
  { t:'The design language',
    go:toScreen('home'),
    body:'<p>Learn these five signals and the whole app becomes readable.</p>'
      + '<ul><li><strong>The eyebrow</strong> — tiny, uppercase, wide-tracked, usually accent-coloured. <code>NEXT APPOINTMENT</code>, <code>ELLIE · DAILY</code>, <code>MY LISTINGS</code>. It labels a block without shouting.</li>'
      + '<li><strong>Gold is money.</strong> Only ever money — prices, commission, market value. It glows slightly. If it is gold, it is Rands.</li>'
      + '<li><strong>Purple is the machine.</strong> The AI badge appears anywhere a model produced something. It is a trust signal, and it never takes the agency’s brand colour.</li>'
      + '<li><strong>Pillar chips</strong> — orange Property, blue Deal, violet Contact, grey Agent. If an item has no pillar, the chip renders nothing at all rather than inventing a destination.</li>'
      + '<li><strong>Accent cards</strong> — a two-pixel left border and a leftward halo — mean “this is a way in”.</li></ul>'
      + '<p>Every card is a vertical gradient with a one-pixel top highlight. Material elevation is zero everywhere; depth is faked with gradients and coloured shadows. That is why it reads as expensive rather than heavy.</p>' },
  { t:'Label Case, and why FICA stays FICA',
    go:toScreen('properties'),
    target:'.card',
    coach:{ t:'Look at the status chips', b:'Under Offer, not under_offer.' },
    body:'<p>Values that come from the API arrive machine-shaped: <code>active</code>, <code>under_offer</code>, <code>sole_mandate</code>. In 1.0.10 the app runs them through a display helper before showing them.</p>'
      + '<p>The rule: replace underscores and hyphens with spaces, collapse the whitespace, raise the first letter of each word — and <strong>never lower-case anything</strong>. So:</p>'
      + '<ul><li><code>active</code> → <strong>Active</strong></li><li><code>under_offer</code> → <strong>Under Offer</strong></li><li><code>sole_mandate</code> → <strong>Sole Mandate</strong></li><li><code>not_started</code> → <strong>Not Started</strong> as a chip, <em>Not started</em> inside a sentence</li></ul>'
      + '<div class="callout"><b>Because it never lower-cases, acronyms survive.</b> ' + G('FICA') + ', ' + G('OTP') + ', ' + G('P24') + ' and VAT stay exactly as they are. You will never see “Fica” or “p24” in this app.</div>'
      + '<div class="callout gotcha"><b>It applies to machine values only.</b> Names, notes and descriptions are rendered exactly as typed. If a seller wrote their surname in lower case, it stays in lower case — the app does not correct people’s own words.</div>' }
]},

{ group:'Daily rhythm', n:7, title:'Today — your schedule and your unread', steps:[
  { t:'Two blocks, nothing else',
    go:toScreen('today'),
    body:'<p>Today is deliberately two blocks: <strong>Today’s Schedule</strong> and <strong>Unread Notifications</strong>. The app polls every sixty seconds and refreshes when you come back to it, so you can leave it open between appointments.</p>'
      + '<p>Each event row carries a colour bar, a fixed time column (or “All day”), the title, and optional location and attendee lines. Tap one and a bottom sheet slides up with the full detail and two actions: <strong>Dismiss</strong> and <strong>Complete</strong>.</p>'
      + '<p>Empty states here are warm, not apologetic: <em>“No events today.”</em> and <em>“You’re all caught up.”</em></p>' }
]},

{ group:'Daily rhythm', n:8, title:'Calendar — four views', steps:[
  { t:'M · W · D · A',
    go:toScreen('calendar'),
    body:'<p>Four views behind one segmented control. <strong>Day</strong> is the default because that is what an agent needs between appointments. Month is for planning, Week for a glance, Agenda for “what is coming”.</p>'
      + '<p>The mail icon in the header opens invitations, and carries an amber dot when RSVPs are pending.</p>'
      + '<div class="callout new"><b>Changed in 1.0.10 — the edit lock.</b> An event’s <em>status</em> no longer locks it. Only its <em>source</em> does, and there are now two distinct messages:<br><br>'
      + '“This is someone else’s private event.” — you are looking at a colleague’s private entry.<br><br>'
      + '“This event comes from another record and is kept in sync with it — change it at the source.” — the event was generated by a property, lease or deal, and editing it here would be overwritten.</div>'
      + '<p>Events you created yourself that never stamped a source are now correctly editable. On 1.0.0 some of those wrongly read as read-only.</p>' }
]},

{ group:'Daily rhythm', n:9, title:'Tasks — the kanban board', steps:[
  { t:'Three columns, two gestures',
    go:toScreen('tasks'),
    body:'<p>Three stacked columns — <strong>To Do</strong>, <strong>In Progress</strong>, <strong>Done</strong> — with a count each. The header subtitle reads “{n} open · {n} overdue”, and the whole line turns red the moment anything is overdue.</p>'
      + '<p>Drag a card between columns. On a phone you long-press to pick it up; here you can drag with the mouse. Long-pressing also offers a <em>Move “{title}”</em> sheet, which is the accessible route.</p>'
      + '<p>Swipe right to <strong>Complete</strong> (green), swipe left for <strong>Didn’t happen</strong> (grey). Overdue cards carry a red border.</p>'
      + '<div class="try">' + icon('drag') + '<div>Try it: drag a card from To Do into In Progress, and watch the open/overdue counter update.</div></div>',
    require:'task-moved' }
]},

{ group:'Daily rhythm', n:10, title:'Quick Add — a task or event in 15 seconds', steps:[
  { t:'The conflict banner warns, it never blocks',
    go:function(){ S.stack=[]; S.screen='tasks'; S.overlay=null; render(); setTimeout(function(){ S.qa.mode='event'; sheet('quick-add'); }, 200); },
    body:'<p>One sheet, two modes. Shared: a title, a priority row, a description and a <strong>Remind me</strong> switch that defaults on. Task mode adds a type and a due date. Event mode adds a date, a start and end time, a type and an all-day switch.</p>'
      + '<div class="callout"><b>The amber banner is the teaching moment.</b> If the new event overlaps existing ones it says “Overlaps 2 events” and lists them. It does not stop you. Double-booking is sometimes exactly what an agent means to do — the app warns and then trusts your judgement.</div>'
      + '<p>Miss a required field and you get an amber snackbar, not a blocking dialog: <em>“Please add a task title, a date and a start time.”</em></p>' }
]},

{ group:'Core work', n:11, essential:true, title:'Uploading a property', steps:[
  { t:'Four steps, and one thing everyone gets wrong',
    go:function(){ S.wiz = newWiz(); S.stack=[]; S.screen='wizard'; S.overlay=null; render(); },
    body:'<p>Step 1 address, step 2 details, step 3 spaces and features, step 4 gallery. A four-segment bar fills as you advance. You move only with the buttons — the steps do not swipe.</p>'
      + '<div class="callout gotcha"><b>The property is created at the end of Step 2, not Step 4.</b> Steps 3 and 4 need a real property ID on the server before they can hold spaces or photos. That is why the button says <strong>Create &amp; Continue</strong> the first time and <strong>Next: Spaces</strong> every time after.<br><br>If you close the wizard after Step 2, the property is <em>already saved</em>, as a draft. It is in your list. It has not vanished.</div>'
      + '<p>Step 1’s Province → City → Suburb cascade is a real teaching moment. Each opens a searchable sheet. City is disabled until a province is chosen; suburb until a city is. Changing a parent clears its children — that is intentional, because a Uvongo suburb under Western Cape would be nonsense.</p>'
      + '<div class="try">' + icon('help') + '<div>Try it: press <strong>Next</strong> to reach Step 2, leave the title blank and press <strong>Create &amp; Continue</strong>. Then use <strong>Take me there</strong> in the dialog.</div></div>' },
  { t:'The detail screen is now tabbed',
    go:function(){ S.propId='p1'; S.propTab='info'; S.stack=[]; S.screen='property'; S.overlay=null; render(); },
    target:'.tabbar',
    coach:{ t:'Five tabs', b:'Info · Compliance · Contacts · Drive · Inspections.' },
    body:'<p>This is the biggest change since 1.0.0. The old Property Overview was one very long scroll. It is now a <strong>collapsing hero</strong>, a <strong>pinned tab bar</strong>, and one independently-scrolling view per tab.</p>'
      + '<ul><li><strong>Info</strong> — at a glance, description, live preview, where this listing is published, virtual tour, key dates.</li>'
      + '<li><strong>Compliance</strong> — the four gates. This is where “why won’t my listing go live?” is answered.</li>'
      + '<li><strong>Contacts · N</strong> — linked contacts, the listing agents and the owner, merged into one place. The count is all three added together.</li>'
      + '<li><strong>Drive · N</strong> — the listing’s documents. New in 1.0.10.</li>'
      + '<li><strong>Inspections</strong> — rentals only. It is simply absent on a sale.</li></ul>'
      + '<p>A tab shows just its name, or <strong>Name · N</strong> when it has a count. If you see no number, there is nothing to count, not zero items hidden.</p>'
      + '<div class="callout new"><b>Also changed:</b> the app-bar title is now the property’s own title — “12 Beach Road, Uvongo” — instead of the word “Overview”. Only the loading and error states still say Overview.</div>'
      + '<p>None of the content changed. Every card, every string, every gate is exactly where it was — just filed behind a tab instead of buried three screens down a scroll.</p>',
    require:'prop-tab:compliance' }
]},

{ group:'Core work', n:12, title:'Spaces, features and photo tags', steps:[
  { t:'Spaces create your photo tags',
    go:function(){ S.wiz = newWiz(); S.wiz.step = 3; S.wiz.created = true; S.stack=[]; S.screen='wizard'; S.overlay=null; render(); },
    body:'<p>Add a space and it appears with a count of one, and the feature picker opens immediately. Bathrooms step by <strong>0.5</strong> — two and a half bathrooms is a real thing — everything else steps by one. Set a count to zero and the space is removed.</p>'
      + '<p>When a space count reaches two, the feature picker grows two tabs: <strong>All Units</strong> and <strong>Per Unit</strong>, so bedroom two can have the balcony that bedroom one does not.</p>'
      + '<div class="callout"><b>This is the connection nobody spots.</b> The photo tags in Step 4 are derived from the spaces you create here. Add a Bedroom and a “Bedroom” tag appears in the gallery. No spaces means no tags, and photos land in Unsorted.</div>' },
  { t:'The upload sheet was rebuilt',
    go:function(){ S.wiz = newWiz(); S.wiz.step = 4; S.wiz.created = true;
      S.wiz.spaces = [{name:'Bedroom',count:3,features:[]},{name:'Bathroom',count:2,features:[]}];
      S.stack=[]; S.screen='wizard'; S.overlay=null; render();
      setTimeout(function(){ S.upload = { queue:[], failed:[], tag:'No tag', preparing:false, uploading:false, done:0, pid:'p2' }; sheet('upload'); }, 250); },
    body:'<p>The header, the tag chips, the three source buttons and the upload button are all unchanged. The machinery underneath is completely different.</p>'
      + '<ul><li><strong>Preparing.</strong> Picked photos are downscaled and orientation-corrected before they enter the queue. You see a spinner and <em>“Preparing photos…”</em>, and the three source buttons are disabled while it runs.</li>'
      + '<li><strong>A durable queue.</strong> Photos survive closing the sheet, and in the real app they survive an app restart. Close it, come back, they are still queued.</li>'
      + '<li><strong>Concurrent uploads with retry.</strong> Up to three at a time, up to three attempts each with a short backoff. Each thumbnail spins while it is in flight.</li>'
      + '<li><strong>New copy.</strong> The header reads <em>“Uploaded 3 of 8…”</em> while uploading and <em>“{n} selected”</em> otherwise. The failed list reads <em>“2 photos didn’t upload — tap to retry”</em> in red, with a <strong>Retry all</strong> button when more than one failed.</li></ul>'
      + '<p>Behind the scenes it also compresses images and converts iPhone HEIC to JPEG before upload. Nothing about that is visible; it just means large photos stop timing out.</p>'
      + '<p>Two more snackbars worth recognising. If the device runs out of room mid-pick: <em>“Couldn’t add 2 photos — device storage may be full”</em>. And if someone deletes a space on the web while your batch is in flight, the tag it was using vanishes underneath you: <em>“Some tags are no longer available — please re-select”</em>.</p>'
      + '<div class="try">' + icon('upload') + '<div>Try it: tap <strong>Gallery</strong>, watch “Preparing photos…”, then <strong>Upload</strong>. One will fail. Retry it.</div></div>',
    require:'upload-retried',
    ctl:[{ l:'Stale-tag snackbar', a:'up-stale-tags' }] }
]},

{ group:'Core work', n:13, essential:true, title:'The compliance gates', steps:[
  { t:'Why your listing won’t go live',
    go:function(){ S.propId='p2'; S.propTab='compliance'; S.complianceLoading=false; S.stack=[]; S.screen='property'; S.overlay=null; render(); },
    body:'<p>This is the single thing new agents get stuck on. The answer is <em>always</em> one of four gates, and they now live on their own tab.</p>'
      + '<ul><li><strong>' + G('Authority to market') + '</strong> — a signed mandate on file.</li>'
      + '<li><strong>Seller ' + G('FICA') + '</strong> — every seller’s identity verified.</li>'
      + '<li><strong>Photos</strong> — enough of them. The chip shows the count.</li>'
      + '<li><strong>Listing details</strong> — the required fields filled in.</li></ul>'
      + '<p>The badge at the top reads <strong>LIVE</strong>, <strong>READY</strong> or <strong>BLOCKED</strong>. Below the gates, an orange panel lists exactly what is blocking go-live, then the sellers with their FICA badges, then the next actions.</p>'
      + '<p><strong>Send Authority to Market</strong> stays disabled until everything is green, with the helper line <em>“Resolve the items above to enable sending to market.”</em></p>'
      + '<div class="callout"><b>Why FICA exists at all.</b> It is South African law — the Financial Intelligence Centre Act. You cannot market a property without the seller’s identity verified. It is not agency bureaucracy, and no one can wave it through for you.</div>'
      + '<div class="try">' + icon('check') + '<div>Try it: resolve each gate using the action on its right, then send it to market.</div></div>',
    require:'sent-to-market' }
]},

{ group:'Core work', n:14, title:'The Overview and portal syndication', steps:[
  { t:'Where this listing is published',
    go:function(){ S.propId='p1'; S.propTab='info'; S.stack=[]; S.screen='property'; S.overlay=null; render(); },
    body:'<p>Under the Info tab, the syndication card shows one row per portal: Website, HFC Premium, Private Property and ' + G('P24','Property24') + '. Each is either a green <strong>Live</strong> pill with a reference, or greyed out with a lock.</p>'
      + '<p>If nothing is live you get: <em>“Not yet published to any portal”</em> and <em>“This listing isn’t live anywhere yet — open Syndication on the desktop to publish.”</em></p>'
      + '<div class="callout gotcha"><b>You cannot publish from the phone.</b> Syndication is a desktop action. The app shows you the state and tells you where to go. That is deliberate — publishing to a portal is a commercial commitment, and it belongs on a screen where you can read the whole listing at once.</div>'
      + '<p>Key dates render as a two-by-two grid. Missing values show an em-dash, never <code>null</code>.</p>' }
]},

{ group:'Core work', n:15, title:'The Property Drive', steps:[
  { t:'A read-only window onto the listing’s documents',
    go:function(){ S.propId='p1'; S.propTab='drive'; S.driveFolder='All'; S.stack=[]; S.screen='property'; S.overlay=null; render(); },
    target:'.folder-strip',
    coach:{ t:'Folder chips', b:'All first, then one per folder with its count.' },
    body:'<p>New in 1.0.10. Every file filed against this listing on the web appears here, with folder chips across the top and a download button on each row.</p>'
      + '<div class="callout gotcha"><b>This tab views and downloads. Nothing else.</b> Uploading, tagging and deleting are web-only. This is the single most common point of confusion — agents look for an upload button here and there isn’t one, by design. Add the file on the website; read it on the phone.</div>'
      + '<p>The card has no title heading, because the “Drive” tab label already names it. Each row is a file-kind icon, the filename, and a metadata line joining <strong>size · uploaded-by · relative-time</strong> with middle dots — <em>1.2 MB · Andre Roets · 3d ago</em>. Anything blank is dropped rather than rendered as an empty gap.</p>'
      + '<p>The <strong>All</strong> chip carries the total. Folders with a count of zero are hidden. An <strong>Unfiled</strong> bucket only appears if the server actually sends one.</p>'
      + '<div class="try">' + icon('download') + '<div>Try it: tap a folder chip to filter, then download a file and read the confirmation dialog.</div></div>',
    require:'drive-download' },
  { t:'Downloads, and the four states',
    go:function(){ S.propId='p1'; S.propTab='drive'; S.stack=[]; S.screen='property'; S.overlay=null; render(); },
    body:'<p>Each row has two icon buttons — <strong>Download</strong> and <strong>Share</strong>. While a download is in flight, that button becomes a spinner. When it finishes you get a dialog:</p>'
      + '<div class="callout new"><b>Download complete</b><br>Mandate.pdf<br>Saved to Downloads.<br><br>[ Done ]  [ Open ]</div>'
      + '<p>If nothing on the device can open that file type you get a snackbar instead: <em>“No app on this device can open {filename}.”</em> Try opening the .xlsx to see it.</p>'
      + '<p>If your account has downloads switched off, both buttons grey out with the tooltip <em>“Downloads are switched off for your account”</em>. That is an agency setting, not a fault.</p>'
      + '<p>Four states worth recognising: a spinner while loading; a cloud-off icon with <em>“Couldn’t load files.”</em> and a Retry button if the fetch fails; <em>“No files on this property yet.”</em> when the listing genuinely has none; and <em>“No files in this folder.”</em> when your folder filter has no matches. The last two look similar and mean very different things.</p>',
    ctl:[{ l:'Downloads off', a:'toggle-downloads' }, { l:'Force a fetch error', a:'drive-force-error' },
         { l:'A property with no files', a:'demo-empty-drive' }] }
]},

{ group:'Core work', n:16, essential:true, title:'Adding a contact', steps:[
  { t:'One page, not a wizard',
    go:function(){ S.nc={first:'',last:'',phone:'',email:'',idnum:'',type:'',notes:''}; S.stack=[]; S.screen='new-contact'; S.overlay=null; render(); },
    body:'<p>A contact is a single small record, so it is a single page. A property needs a server ID before it can hold photos, so it is a wizard. That is the whole reason for the difference.</p>'
      + '<p>First name, last name and phone are required. Contact Type is the agency’s own list. After a successful create the app <strong>immediately opens the new contact’s detail screen</strong> — that surprises people the first time.</p>'
      + '<div class="callout gotcha"><b>Things that are not here, because agents hunt for them.</b> There is no CSV or bulk import, no free-text tags, and no “source” field in the mobile app. What you get is the Contact Type dropdown and, separately, a <strong>role per linked property</strong> — seller, landlord, buyer, tenant.</div>'
      + '<div class="try">' + icon('users') + '<div>Try it: fill in a name and enter the phone <strong>082 555 1234</strong>. That number is already on file, so the duplicate dialog fires.</div></div>' },
  { t:'The contact page is now tabbed too',
    go:function(){ S.contactId='c1'; S.contactTab='details'; S.stack=[]; S.screen='contact'; S.overlay=null; render(); },
    target:'.tabbar',
    coach:{ t:'Details · Matches · Properties', b:'Same treatment as the property screen.' },
    body:'<p>Same pattern as the property screen: a collapsing hero, then a pinned tab bar.</p>'
      + '<p>The hero <strong>does not repeat the name</strong> — the app bar already has it, with the edit pencil. Instead you get a larger initials avatar, the contact-type pill in Label Case, and a one-line reach summary joining phone and email with a middle dot.</p>'
      + '<ul><li><strong>Details</strong> — the WhatsApp button and the +Match / +Listing row, then the phone/email/ID rows, the green WhatsApp counter, and the Compliance tile.</li>'
      + '<li><strong>Matches · N</strong> — their saved buyer or tenant criteria.</li>'
      + '<li><strong>Properties · N</strong> — note the label. It used to read “Linked Properties”; the empty-state heading is still <em>“No linked listings”</em>.</li></ul>'
      + '<div class="callout new"><b>New empty state.</b> A contact with no phone, no email, no ID and no WhatsApp history now says: <em>“No phone, email or ID captured yet. Tap Edit to add them.”</em> Previously that card was simply blank, which read like a loading failure.</div>'
      + '<p>Every WhatsApp tap is logged server-side and increments that counter. That is how the agency measures outreach, so it matters that you use the button rather than your own phone.</p>'
      + '<p>Call, WhatsApp and Email buttons now fail gracefully: on a device with no phone app, the number or address is copied to the clipboard with a snackbar instead of doing nothing.</p>',
    ctl:[{ l:'A contact with nothing captured', a:'demo-empty-contact' }] }
]},

{ group:'Core work', n:17, title:'Contact compliance — consent, documents, FICA', steps:[
  { t:'Three tabs, one legal obligation',
    go:function(){ S.contactId='c1'; S.ccTab='consent'; S.stack=[]; S.screen='contact-compliance'; S.overlay=null; render(); },
    body:'<p><strong>Consent</strong> is a switch per type. Switching one on asks how consent was given — Electronic, Verbal, Written or Signed document. Switching one off asks for an optional reason and logs it. Every change is written to a history you cannot edit.</p>'
      + '<p><strong>Documents</strong> is the contact-level drive: a 20 MB limit, a document type, an optional link to a property, and grouping by property address with an “Unlinked” group.</p>'
      + '<p><strong>FICA</strong> is read-only in the app. Submissions show risk, who verified, when, when it expires, and whether the PDF is available.</p>'
      + '<div class="callout">' + G('POPIA') + ' is South Africa’s privacy law. Consent is not a nicety — a client can revoke at any time, and the moment they do, the agency must stop contacting them that way. The ledger the client sees in their own portal is this same ledger. One source of truth.</div>' }
]},

{ group:'Core work', n:18, title:'Core Matches and the WhatsApp share', steps:[
  { t:'A scoring engine, not a model',
    go:function(){ S.matchId='m1'; S.stack=[]; S.screen='match'; S.overlay=null; render(); },
    body:'<p>A ' + G('Core Match') + ' is a saved buyer or tenant requirement. The system scores every property against it — price, beds, suburb, features — and files the results into three tiers: <strong>Strong</strong> at 80 and above, <strong>Good</strong> 65–79, <strong>Fair</strong> 50–64. Anything below 50 is not shown.</p>'
      + '<div class="callout"><b>The name misleads people.</b> This is a deterministic scoring engine. Same inputs, same score, every time. There is no machine learning here, and it carries no AI badge for exactly that reason.</div>'
      + '<p>Client reactions flow back here in real time — Interested, Saved, Not for me — with the reason the client typed. That reason is the most valuable thing in the whole feature.</p>'
      + '<p>The WhatsApp share opens a sheet with an editable, server-rendered message listing the matched properties. Sending <strong>logs it first</strong>, then opens WhatsApp — which is why the counter is trustworthy.</p>' }
]},

{ group:'Core work', n:19, title:'Portal Leads', steps:[
  { t:'Enquiries from the public portals',
    go:toScreen('leads'),
    body:'<p>These are enquiries that came in from Property24 and Private Property, landing straight in your pocket. The week strip is Sunday-anchored with per-day totals, and you cannot navigate past the current week.</p>'
      + '<p>Source chips: red <strong>P24</strong>, blue <strong>PP</strong>. A phone number that is WhatsApp-capable carries a WhatsApp tag.</p>'
      + '<p>Speed of response is the entire game here — that is why this is the one Home tile with an unread dot.</p>' }
]},

{ group:'The AI', n:20, essential:true, title:'Meet Ellie', steps:[
  { t:'First, the microphone',
    go:function(){ S.ai = true; S.ellie.micGranted = false; S.ellie.permanentlyDenied = false;
      S.stack=[]; S.screen='ellie'; S.overlay=null; render(); },
    target:'#mic',
    coach:{ t:'Not granted yet', b:'The icon is a crossed-out mic. Tap it to ask.' },
    body:'<p>New in 1.0.10, and worth doing slowly — permission prompts are exactly where non-technical users get stuck.</p>'
      + '<p>Until the microphone is granted, the button shows a <strong>crossed-out mic</strong> and the copy changes:</p>'
      + '<ul><li>Status line: <em>“Ellie needs your microphone to hear you”</em></li>'
      + '<li>Hint, if simply not asked yet or denied: <em>“Tap the mic to allow access.”</em></li>'
      + '<li>Hint, if permanently denied: <em>“Turn on Microphone for CoreX in Settings, then come back.”</em></li>'
      + '<li>Button caption: <strong>Tap to enable</strong>, or <strong>Open Settings</strong> when it is permanently off.</li></ul>'
      + '<div class="callout gotcha"><b>The first press asks; it does not record.</b> You have to press again once access is granted. That trips up almost everyone the first time — people hold the mic, nothing happens, and they assume Ellie is broken.</div>'
      + '<p>Granting shows <em>“Microphone on — hold the mic and speak.”</em> Denying shows <em>“Ellie needs the microphone to hear you.”</em> Permanently denying shows <em>“Microphone access is off for CoreX. Turn it on in Settings.”</em> with a Settings button that takes you there.</p>'
      + '<div class="try">' + icon('microphone') + '<div>Try it: tap the mic once to grant access. Then hold it.</div></div>',
    require:'mic-granted',
    ctl:[{ l:'Not granted', a:'ellie-mic-state', p:'denied' }, { l:'Permanently denied', a:'ellie-mic-state', p:'blocked' },
         { l:'Granted', a:'ellie-mic-state', p:'granted' }, { l:'Recording fails', a:'ellie-rec-fail' }] },
  { t:'Book a viewing with your voice',
    go:function(){ S.ai = true; S.ellie.micGranted = true; S.stack=[]; S.screen='ellie'; S.overlay=null; render(); },
    target:'#mic',
    coach:{ t:'Press and hold', b:'It turns red and pulses. Release to send.' },
    body:'<p>Hold the mic, speak, release. The button turns red and pulses while recording. Then <em>“Thinking…”</em>, and a result sheet slides up with your transcript and what Ellie did:</p>'
      + '<p><strong>Scheduled: Viewing with John Meyer — Tue 11:00</strong>, with <strong>Undo</strong> and <strong>Open event</strong>.</p>'
      + '<div class="callout"><b>Be honest about what Ellie is.</b> She is a voice-to-action assistant: you speak, she transcribes, she extracts an intent, and she creates a calendar event — which you can undo in one tap. She is <em>not</em> a chatbot. There is no conversation thread, no follow-up questions, and she does exactly one thing. Setting that expectation prevents a lot of disappointment.</div>'
      + '<p>Failure paths are real and worth seeing: release under 0.4 seconds and you get <em>“Hold to talk — press and hold the mic”</em>. Nothing intelligible and the sheet reads <em>“I didn’t catch that.”</em> Agency without the AI add-on: <em>“Ellie voice isn’t available on this account yet.”</em></p>'
      + '<div class="try">' + icon('microphone') + '<div>Try it: press and hold the mic for a second, release, then tap <strong>Open event</strong> and find it in the calendar.</div></div>',
    require:'ellie-booked' }
]},

{ group:'The AI', n:21, essential:true, title:'AI photo analysis', steps:[
  { t:'It proposes. You confirm.',

/* ==========================================================================
   13. TOUR ENGINE — rail, explanation panel, spotlight, coach marks
   ========================================================================== */
var T = {
  active: true,
  ch: 0,
  step: 0,
  done: ls('done') || {},
  panel: null,          // 'legend' | 'gestures' | null
  search: '',
  express: false
};

function chapter(){ return CHAPTERS[T.ch]; }
function step(){ var c = chapter(); return c && c.steps[T.step]; }
function stepKey(){ return T.ch + ':' + T.step; }

function runStep(){
  var s = step();
  if (!s) return;
  S.overlay = null; S.drawer = false;
  if (s.go) s.go();
  else render();
  renderExplain(); paintRail();
  requestAnimationFrame(function(){ requestAnimationFrame(positionSpot); });
}
function goStep(ch, st){
  T.ch = Math.max(0, Math.min(CHAPTERS.length - 1, ch));
  T.step = st || 0;
  runStep();
}
function nextStep(){
  var c = chapter();
  markDone();
  if (T.step < c.steps.length - 1){ T.step++; runStep(); return; }
  var nc = T.ch + 1;
  if (T.express){ while (nc < CHAPTERS.length && !CHAPTERS[nc].essential) nc++; }
  if (nc >= CHAPTERS.length){ T.ch = CHAPTERS.length - 1; T.step = c.steps.length - 1; renderExplain(); return; }
  goStep(nc, 0);
}
function prevStep(){
  if (T.step > 0){ T.step--; runStep(); return; }
  var pc = T.ch - 1;
  if (T.express){ while (pc >= 0 && !CHAPTERS[pc].essential) pc--; }
  if (pc < 0) return;
  goStep(pc, CHAPTERS[pc].steps.length - 1);
}
function markDone(){
  T.done[stepKey()] = true;
  ls('done', T.done);
  paintRail();
}
function chapterDone(i){
  return CHAPTERS[i].steps.every(function(_, j){ return T.done[i + ':' + j]; });
}
/* a step that requires an interaction advances itself once it happens */
function tourCheck(key){
  if (!T.active) return;
  var s = step();
  if (s && s.require && s.require === key && !T.done[stepKey()]){
    markDone();
    var panel = $('#explainCol');
    if (panel){
      var t = $('.try', panel);
      if (t) t.classList.add('done');
    }
    setTimeout(function(){ if (step() === s) nextStep(); }, 1100);
  }
}

/* ---------- rail ---------- */
function paintRail(){
  var rail = $('#rail');
  if (!rail) return;
  var q = T.search.toLowerCase();
  var html = '<div class="rail-top">'
    + '<input class="rail-search" placeholder="Search the tour…" id="railSearch" value="' + esc(T.search) + '">'
    + '<a class="store-tile" id="railStoreBtn" href="' + esc(APP.playStore) + '"'
    + ' target="_blank" rel="noopener noreferrer"'
    + ' title="Get CoreX OS on Google Play" aria-label="Get CoreX OS on Google Play">'
    + playLogo(19) + '</a>'
    + '</div>';
  var lastGroup = '', any = false;
  CHAPTERS.forEach(function(c, i){
    if (T.express && !c.essential) return;
    if (q){
      var hay = (c.title + ' ' + c.group + ' ' + c.steps.map(function(s){ return s.t + ' ' + s.body; }).join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return;
    }
    any = true;
    if (c.group !== lastGroup){ html += '<div class="rail-group">' + esc(c.group) + '</div>'; lastGroup = c.group; }
    html += '<button class="rail-item' + (chapterDone(i) ? ' done' : '') + '" data-ch="' + i + '" aria-current="' + (i === T.ch) + '">'
      + '<span class="rail-num">' + c.n + '</span>'
      + '<span style="flex:1">' + esc(c.title) + '</span>'
      + (c.essential ? '<span class="rail-star">★</span>' : '')
      + '<span class="rail-tick">' + icon('circle-check',13) + '</span></button>';
  });
  if (!any) html += '<div class="rail-empty">Nothing matches “' + esc(T.search) + '”.</div>';
  html += '<div class="divider"></div>'
    + '<button class="tb-btn' + (T.express ? ' on' : '') + '" id="expressBtn" style="width:100%;justify-content:center">'
    + 'Just the essentials (10 min)</button>'
    + '<button class="tb-btn" id="resetBtn" style="width:100%;justify-content:center;margin-top:8px">Reset progress</button>';
  rail.innerHTML = html;
}
document.addEventListener('click', function(ev){
  var r = ev.target.closest('.rail-item[data-ch]');
  if (r){ T.active = true; goStep(Number(r.getAttribute('data-ch')), 0); return; }
  if (ev.target.closest('#expressBtn')){ T.express = !T.express; if (T.express && !chapter().essential){ var i=0; while(i<CHAPTERS.length && !CHAPTERS[i].essential) i++; goStep(i,0); } paintRail(); renderExplain(); return; }
  if (ev.target.closest('#resetBtn')){ T.done = {}; ls('done', {}); paintRail(); renderExplain(); return; }
});
document.addEventListener('input', function(ev){
  if (ev.target.id === 'railSearch'){
    T.search = ev.target.value; paintRail();
    var n = $('#railSearch'); if (n){ n.focus(); n.setSelectionRange(T.search.length, T.search.length); }
  }
});

/* ---------- explanation panel ---------- */
function renderExplain(){
  var col = $('#explainCol');
  if (!col) return;
  if (T.panel === 'legend'){ col.innerHTML = legendPanel(); return; }
  if (T.panel === 'gestures'){ col.innerHTML = gesturePanel(); return; }
  if (!T.active){ col.innerHTML = roamPanel(); return; }

  var c = chapter(), s = step();
  if (!c || !s) return;
  var totalSteps = c.steps.length;
  var doneCount = Object.keys(T.done).length;
  var totalAll = CHAPTERS.reduce(function(a, x){ return a + x.steps.length; }, 0);

  var h = '<div class="panel">'
    + '<div class="meta"><span class="chip accent">' + esc(c.group) + '</span>'
    + '<span class="chip">Chapter ' + c.n + '</span>'
    + (c.essential ? '<span class="chip money">★ Essential</span>' : '')
    + '<span class="chip">Step ' + (T.step + 1) + ' of ' + totalSteps + '</span></div>'
    + '<h2>' + esc(c.title) + '</h2>'
    + '<p style="font-size:13px;color:var(--text-tertiary);margin-bottom:16px">' + esc(s.t) + '</p>'
    + s.body
    + (s.ctl ? '<div class="demo-ctl">' + s.ctl.map(function(x){
        return '<button class="tb-btn" data-a="' + x.a + '"' + (x.p ? ' data-p="' + esc(x.p) + '"' : '') + '>' + esc(x.l) + '</button>'; }).join('') + '</div>' : '')
    + '<div class="nav-row">'
    + '<button class="tb-btn" id="prevBtn">' + icon('chevron-left') + 'Back</button>'
    + '<button class="tb-btn on" id="nextBtn">' + (s.require && !T.done[stepKey()] ? 'Do it to continue' : 'Next') + icon('chevron-right') + '</button>'
    + '<button class="tb-btn" id="skipBtn">Skip chapter</button>'
    + '<div class="grow"></div>'
    + '<span class="t12t">← → to move · Esc to explore</span></div>'
    + '<div class="pbar"><i style="width:' + Math.round(doneCount / totalAll * 100) + '%"></i></div>'
    + '<div class="t12t" style="margin-top:6px">' + doneCount + ' of ' + totalAll + ' steps complete · replica of CoreX OS ' + APP.versionLabel + '</div>'
    + '</div>';
  col.innerHTML = h;
  var nb = $('#nextBtn');
  if (nb && s.require && !T.done[stepKey()]) nb.disabled = false;
}
document.addEventListener('click', function(ev){
  if (ev.target.closest('#nextBtn')) nextStep();
  else if (ev.target.closest('#prevBtn')) prevStep();
  else if (ev.target.closest('#skipBtn')){ markDone(); var nc = T.ch + 1; if (T.express){ while (nc < CHAPTERS.length && !CHAPTERS[nc].essential) nc++; } if (nc < CHAPTERS.length) goStep(nc, 0); }
});
document.addEventListener('keydown', function(ev){
  if (ev.target.matches('input,textarea')) return;
  if (ev.key === 'ArrowRight'){ nextStep(); }
  else if (ev.key === 'ArrowLeft'){ prevStep(); }
  else if (ev.key === 'Escape'){ setRoam(true); }
});

document.addEventListener('click', function(ev){
  if (ev.target.closest('#backToTour')) setRoam(false);
});
function setRoam(on){
  T.active = !on;
  T.panel = null;
  clearSpot();
  paintTopbar(); renderExplain();
  if (!on) runStep();
}

/* ---------- spotlight + coach mark ---------- */
function clearSpot(){
  var l = $('#spotLayer'), c = $('#coach');
  if (l) l.hidden = true;
  if (c) c.hidden = true;
}
function positionSpot(){
  var layer = $('#spotLayer'), ring = $('#spotRing'), mask = $('#spotMask'), coach = $('#coach');
  if (!layer) return;
  var s = T.active ? step() : null;
  if (!s || !s.target || S.forceUpdate){ clearSpot(); return; }
  var screen = $('#screen'), node = $(s.target, $('#viewport'));
  if (!node){ clearSpot(); return; }
  var sr = screen.getBoundingClientRect(), nr = node.getBoundingClientRect();
  var x = nr.left - sr.left - 6, y = nr.top - sr.top - 6, w = nr.width + 12, hh = nr.height + 12;
  if (y + hh < 0 || y > sr.height){ clearSpot(); return; }
  layer.hidden = false;
  ring.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + hh + 'px';
  mask.style.cssText = '-webkit-mask-image:radial-gradient(circle at 0 0,#000 0,#000 0);';
  /* four-rect cut-out via clip-path keeps the hole crisp at any radius */
  mask.style.clipPath = 'polygon(0 0,100% 0,100% 100%,0 100%,0 0,'
    + x + 'px ' + y + 'px,' + x + 'px ' + (y+hh) + 'px,' + (x+w) + 'px ' + (y+hh) + 'px,'
    + (x+w) + 'px ' + y + 'px,' + x + 'px ' + y + 'px)';
  mask.style.webkitMaskImage = 'none'; mask.style.maskImage = 'none';

  if (s.coach){
    coach.hidden = false;
    coach.innerHTML = '<h5>' + esc(s.coach.t) + '</h5><p>' + esc(s.coach.b) + '</p>';
    var below = y + hh + 12;
    var cw = 250;
    var cx = Math.max(10, Math.min(sr.width - cw - 10, x + w/2 - cw/2));
    var fitsBelow = below + 90 < sr.height;
    coach.style.left = cx + 'px';
    coach.style.top = (fitsBelow ? below : Math.max(10, y - 96)) + 'px';
    coach.style.width = cw + 'px';
  } else coach.hidden = true;
}
window.addEventListener('resize', positionSpot);
document.addEventListener('scroll', positionSpot, true);

/* ---------- legend + gesture cheat-sheet + glossary ---------- */
function sw(c){ return '<span class="legend-sw" style="background:' + c + '"></span>'; }
function legendPanel(){
  return '<div class="panel"><h2>Legend</h2>'
    + '<p>A live key to the design language. These are the production token values.</p>'
    + '<h4>Status</h4><div class="legend-grid">'
    + [['#22C55E','Active · Live · Done'],['#F59E0B','Draft · Pending · Under Offer'],['#EF4444','Overdue · Expired · Error'],
       ['#3B82F6','Info · Ready'],['#6B7280','Paused · Skip · To Do']].map(function(x){
      return '<div class="legend-item">' + sw(x[0]) + esc(x[1]) + '</div>'; }).join('') + '</div>'
    + '<h4>Pillars (contractual)</h4><div class="legend-grid">'
    + [['#F97316','Property'],['#3B82F6','Deal'],['#8B5CF6','Contact'],['#8890A4','Agent']].map(function(x){
      return '<div class="legend-item">' + sw(x[0]) + esc(x[1]) + '</div>'; }).join('') + '</div>'
    + '<h4>Semantic roles</h4><div class="legend-grid">'
    + '<div class="legend-item">' + sw('#E8B86D') + 'Money gold — only ever Rands</div>'
    + '<div class="legend-item"><span class="ai-badge">' + icon('robot',11) + 'AI</span> A model produced this</div>'
    + '<div class="legend-item">' + sw('var(--accent)') + 'Agency accent (white-labelled)</div></div>'
    /* rendered through the real helpers, so this table can never drift from the app */
    + '<h4>Label Case</h4>'
    + '<table class="cmp-table"><tr><th>From the API</th><th>As a chip</th><th>In a sentence</th></tr>'
    + ['active','under_offer','sole_mandate','not_started','FICA','P24','OTP'].map(function(v){
        return '<tr><td><code>' + esc(v) + '</code></td><td>' + esc(labelCase(v)) + '</td><td>' + esc(sentenceCase(v)) + '</td></tr>'; }).join('')
    + '</table>'
    + '<p style="margin-top:10px">Nothing is ever lower-cased, which is why the acronyms come through untouched. '
    + 'User-typed text — names, notes, descriptions — never goes through this at all.</p>'
    + '<h4>Confidence pips</h4>'
    + '<p>Four dots under an AI suggestion, filled in proportion to confidence. Anything at 50% or more is pre-ticked; you can always untick it.</p>'
    + '<h4>Radii</h4><p><code>14px</code> cards · <code>12px</code> buttons and inputs · <code>10px</code> icon boxes · <code>20px</code> sheets and the bottom nav · full pill for chips.</p>'
    + '<div class="nav-row"><button class="tb-btn on" id="closePanel">Back to the tour</button></div></div>';
}

document.addEventListener('click', function(ev){
  if (ev.target.closest('#closePanel')){ T.panel = null; renderExplain(); }
});

var GLOSSARY = {
  'FICA':'The Financial Intelligence Centre Act. South African law requiring an agency to verify the identity of the parties to a property transaction. A listing cannot be marketed until the seller’s FICA is approved.',
  'POPIA':'The Protection of Personal Information Act — South Africa’s privacy law. It is why consent is recorded per channel, is revocable at any time, and is logged.',
  'Authority to market':'The signed mandate giving the agency the right to market a property. Without it, the listing is legally blocked from going live.',
  'P24':'Property24 — the largest South African property portal. A listing syndicated there carries a reference like P24-884120.',
  'Core Match':'A saved buyer or tenant requirement. The system scores properties against it deterministically — it is not machine learning.',
  'OTP':'One-time PIN. A six-digit code emailed to a client so they can set a password and activate their account.'
};
var glossPop = null;
document.addEventListener('mouseover', function(ev){
  var g = ev.target.closest('[data-gloss]');
  if (!g) return;
  var term = g.getAttribute('data-gloss'), def = GLOSSARY[term];
  if (!def) return;
  if (glossPop) glossPop.remove();
  glossPop = el('<div class="gloss-pop"><b>' + esc(term) + '</b>' + esc(def) + '</div>');
  document.body.appendChild(glossPop);
  var r = g.getBoundingClientRect();
  glossPop.style.left = Math.max(10, Math.min(window.innerWidth - 300, r.left)) + 'px';
  glossPop.style.top = (r.bottom + 8) + 'px';
});
document.addEventListener('mouseout', function(ev){
  if (!ev.target.closest('[data-gloss]')) return;
  if (glossPop){ glossPop.remove(); glossPop = null; }
});

/* ==========================================================================
   14. TOP BAR + BOOT
   ========================================================================== */
var AGENCIES = [
  { n:'Sky', c:'#0EA5E9' }, { n:'Emerald', c:'#10B981' },
  { n:'Crimson', c:'#E11D48' }, { n:'Violet', c:'#7C3AED' }
];
function setTheme(t){
  S.theme = t; S.settings.dark = t === 'dark';
  document.documentElement.setAttribute('data-corex-theme', t);
  ls('theme', t);
  paintTopbar(); render();
}
function setAccent(hex){
  S.accent = hex;
  var r = document.documentElement.style;
  r.setProperty('--accent', hex);
  r.setProperty('--accent-soft', hexA(hex, .15));
  r.setProperty('--accent-glow', hexA(hex, .25));
  r.setProperty('--accent-border', hexA(hex, .40));
  paintTopbar(); render();
}
function hexA(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
function paintTopbar(){
  var sw = $('#swatches');
  if (sw && !sw.childElementCount){
    sw.innerHTML = AGENCIES.map(function(a){
      return '<button class="swatch" data-acc="' + a.c + '" style="background:' + a.c + '" title="' + a.n + '" aria-pressed="false" aria-label="' + a.n + '"></button>'; }).join('');
  }
  $$('#swatches .swatch').forEach(function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-acc').toLowerCase() === S.accent.toLowerCase());
  });
  $$('#sideSeg button').forEach(function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-side') === S.side);
  });
  var ai = $('#aiSwitch'); if (ai) ai.setAttribute('aria-checked', S.ai);
  var tb = $('#themeBtn');
  if (tb) tb.innerHTML = icon(S.theme === 'dark' ? 'sun' : 'moon') + (S.theme === 'dark' ? 'Light' : 'Dark');
  var db = $('#deviceBtn');
  if (db) db.innerHTML = icon(S.device === 'phone' ? 'device-tablet' : 'device-mobile') + (S.device === 'phone' ? 'Tablet' : 'Phone');
  var rb = $('#roamBtn');
  if (rb){ rb.textContent = T.active ? 'Explore on your own' : 'Back to the tour'; rb.classList.toggle('on', !T.active); }
  var lb = $('#legendBtn'); if (lb) lb.classList.toggle('on', T.panel === 'legend');
  var cb = $('#cheatBtn'); if (cb) cb.classList.toggle('on', T.panel === 'gestures');
  var vc = $('#verChip'); if (vc) vc.textContent = APP.footerLabel;
  var sb = $('#storeBtn');
  if (sb && !sb.childElementCount) sb.innerHTML = playLogo(16) + '<span>Get the app</span>';
}
document.addEventListener('click', function(ev){
  var t = ev.target;
  var acc = t.closest('[data-acc]');
  if (acc){ setAccent(acc.getAttribute('data-acc')); return; }
  var side = t.closest('#sideSeg button');
  if (side){
    S.side = side.getAttribute('data-side');
    S.stack = [];
    S.screen = S.side === 'client' ? 'client-home' : 'home';
    S.overlay = null; S.drawer = false;
    paintTopbar(); render();
    return;
  }
  if (t.closest('#aiSwitch')){
    S.ai = !S.ai;
    if (!S.ai && S.screen === 'ellie') S.screen = 'home';
    paintTopbar(); render();
    return;
  }
  if (t.closest('#themeBtn')){ setTheme(S.theme === 'dark' ? 'light' : 'dark'); return; }
  if (t.closest('#deviceBtn')){
    S.device = S.device === 'phone' ? 'tablet' : 'phone';
    $('#phone').parentElement.classList.toggle('tablet', S.device === 'tablet');
    document.body.classList.toggle('tablet', S.device === 'tablet');
    paintTopbar(); render();
    setTimeout(positionSpot, 60);
    return;
  }
  if (t.closest('#legendBtn')){ T.panel = T.panel === 'legend' ? null : 'legend'; clearSpot(); paintTopbar(); renderExplain(); return; }
  if (t.closest('#cheatBtn')){ T.panel = T.panel === 'gestures' ? null : 'gestures'; clearSpot(); paintTopbar(); renderExplain(); return; }
  if (t.closest('#roamBtn')){ setRoam(T.active); return; }
  if (t.closest('#restartBtn')){
    T.done = {}; ls('done', {});
    T.active = true; T.panel = null; T.express = false;
    S.side = 'agent'; S.ai = true; S.forceUpdate = false; S.deletedAccount = false;
    S.updateDialogSeen = true;
    goStep(0, 0); paintTopbar();
    return;
  }
});

/* drag-and-drop for task cards (mouse + touch via pointer events) */
document.addEventListener('dragstart', function(ev){
  var c = ev.target.closest('.task-card');
  if (!c) return;
  S.dragTask = c.getAttribute('data-task');
  ev.dataTransfer.effectAllowed = 'move';
  try { ev.dataTransfer.setData('text/plain', S.dragTask); } catch(e){}
});
document.addEventListener('dragover', function(ev){
  if (!S.dragTask) return;
  var z = ev.target.closest('.dropzone');
  if (z){ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; }
});
document.addEventListener('drop', function(ev){
  var z = ev.target.closest('.dropzone');
  if (!z || !S.dragTask) return;
  ev.preventDefault();
  var t = DB.tasks.filter(function(x){ return x.id === S.dragTask; })[0];
  if (t) t.col = z.getAttribute('data-col');
  S.dragTask = null;
  render();
  tourCheck('task-moved');
});

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-corex-theme', S.theme);
setAccent(S.accent);
paintTopbar();
paintRail();
T.active = true;
S.updateDialogSeen = true;      /* the tour drives the update dialog explicitly */
goStep(0, 0);
</script>

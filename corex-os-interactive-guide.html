<script>
/* Stamp the theme before the stylesheet is applied, so the page never flashes
   light on its way to dark. The app boots dark; a saved choice wins. */
(function(){
  var t = 'dark';
  try { var s = localStorage.getItem('corex_guide_theme'); if (s) t = JSON.parse(s); } catch(e){}
  document.documentElement.setAttribute('data-corex-theme', t === 'light' ? 'light' : 'dark');
})();
</script>
<style>
/* ============================================================================

/* --- Brand / accent (white-labelled, server-driven; defaults shown) -------- */
:root{
  --accent:#0EA5E9;
  --accent-soft:rgba(14,165,233,0.15);
  --accent-glow:rgba(14,165,233,0.25);
  --accent-border:rgba(14,165,233,0.40);

  --ok:#22C55E; --ok-delta:#6BD968;
  --warn:#F59E0B; --danger:#EF4444; --destructive:#DC2626;
  --info:#3B82F6; --neutral:#6B7280; --neutral-2:#8890A4;

  --pillar-property:#F97316;
  --pillar-deal:#3B82F6;
  --pillar-contact:#8B5CF6;
  --pillar-agent:#8890A4;

  --r-card:14px; --r-button:12px; --r-small:10px; --r-large:20px; --r-pill:999px;

  --font:"Plus Jakarta Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

/* --- Light palette (bare :root so no colour is media-query-only) ---------- */
:root{
  --page-base:#E4EAF3;
  --page-top-tint:#D3DCEA;
  --surface-top:#FFFFFF;
  --surface-base:#F6F8FC;
  --text-primary:#0B1426;

  --border:rgba(0,0,0,0.08);

  --ai-bg:#EDE4FB; --ai-fg:#5B2BB5;
  --scrim:rgba(11,20,38,0.45);
  --card-border:1px solid rgba(0,0,0,0.08);
  color-scheme:light;
}

/* --- Dark palette (the app boots dark) ----------------------------------- */
:root[data-corex-theme="dark"]{
  --page-base:#0A0F1C;
  --page-top-tint:#16243F;
  --surface-top:#1B2440;
  --surface-base:#131A2A;
  --text-primary:#F5F7FB;
  --text-secondary:#8B9AB5;
  --text-tertiary:#5C6B85;

  --ai-bg:rgba(59,30,99,0.85); --ai-fg:#C9B6F5;
  --scrim:rgba(0,0,0,0.55);
  --card-border:1px solid transparent;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font);
  background:var(--page-base);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
svg{display:block;}

/* ============================ PAGE CHROME ================================ */
.page{
  min-height:100vh;
  background:radial-gradient(120% 110% at 50% 0%, var(--page-top-tint) 0%, var(--page-base) 55%);
  display:flex;flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 18px;
  background:var(--page-base);
  border-bottom:1px solid var(--border);
}
.wordmark{font-size:18px;font-weight:800;letter-spacing:-0.4px;white-space:nowrap;}
.wordmark .os{
  background:linear-gradient(135deg,var(--accent),#7fd8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.topbar .spacer{flex:1 1 auto;}
.tb-group{display:flex;align-items:center;gap:6px;}
.tb-label{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-tertiary);}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 11px;border-radius:var(--r-button);
  background:var(--fill-1);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text-secondary);
  transition:background .18s,color .18s,border-color .18s;white-space:nowrap;
}
.tb-btn:hover{color:var(--text-primary);background:var(--fill-2);}
.tb-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border);}
.tb-btn svg{width:15px;height:15px;}
.seg{display:inline-flex;background:var(--fill-1);border:1px solid var(--border);border-radius:var(--r-button);padding:3px;gap:2px;}
.seg button{height:26px;padding:0 11px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--text-tertiary);}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);}
.swatches{display:inline-flex;gap:5px;}
.swatch{width:20px;height:20px;border-radius:var(--r-pill);border:2px solid transparent;transition:transform .14s,border-color .14s;}
.swatch[aria-pressed="true"]{border-color:var(--text-primary);transform:scale(1.15);}
.switch{position:relative;width:36px;height:21px;border-radius:var(--r-pill);background:var(--fill-2);border:1px solid var(--border);transition:background .18s;flex:none;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text-tertiary);transition:transform .18s,background .18s;}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-border);}
.switch[aria-checked="true"]::after{transform:translateX(15px);background:var(--accent);}

/* ============================ LAYOUT ===================================== */
.stage{
  flex:1 1 auto;display:flex;gap:28px;align-items:flex-start;
  padding:24px 18px 60px;max-width:1520px;margin:0 auto;width:100%;
}
.rail{width:230px;flex:none;position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px;}
.rail-search{width:100%;height:34px;border-radius:var(--r-button);border:1px solid var(--border);background:var(--fill-1);padding:0 11px;font-size:12.5px;margin-bottom:10px;}
/* the tour search and the Play Store link, side by side at the top of the rail */
.rail-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.rail-top .rail-search{flex:1 1 auto;min-width:0;margin-bottom:0;}
.store-tile{

  display:flex;align-items:center;justify-content:center;
  background:var(--fill-1);border:1px solid var(--border);
  transition:background .16s,border-color .16s,transform .14s;
}
.store-tile:hover{background:var(--accent-soft);border-color:var(--accent-border);transform:translateY(-1px);}
.rail-group{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-tertiary);margin:15px 0 5px 8px;}
.rail-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 9px;border-radius:var(--r-small);font-size:12px;font-weight:600;color:var(--text-secondary);line-height:1.35;transition:background .16s,color .16s;}
.rail-item:hover{background:var(--fill-1);color:var(--text-primary);}
.rail-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);}
.rail-num{font-size:10px;font-weight:700;color:var(--text-tertiary);width:15px;flex:none;}

.rail-tick{width:13px;height:13px;flex:none;color:var(--ok);opacity:0;}
.rail-item.done .rail-tick{opacity:1;}
.rail-star{font-size:8px;font-weight:700;letter-spacing:.6px;color:var(--money);background:var(--money-soft);border-radius:3px;padding:1px 4px;flex:none;}
.rail-empty{font-size:12px;color:var(--text-tertiary);padding:10px 9px;}

.phone-col{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;}

/* ============================ PHONE FRAME ================================ */
.phone-wrap{position:relative;}
.phone{

             inset 0 0 0 2px rgba(255,255,255,.5),0 0 70px -24px var(--accent-glow);
}
.screen{

.statusbar{height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:12px;font-weight:700;position:relative;z-index:5;flex:none;}

.tablet .island{display:none;}

/* ============================ MOTION ===================================== */
.fade-in{animation:fadeScale .26s cubic-bezier(.22,.61,.36,1);}

.press{transition:transform .14s ease-out;}

@media (prefers-reduced-motion:reduce){

/* ======================= COMPONENT LIBRARY (unchanged) =================== */
.card{
  position:relative;border-radius:var(--r-card);padding:16px;
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));
  box-shadow:var(--seat);border:var(--card-border);
}
.card::before{
  content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--r-card) var(--r-card) 0 0;
  background:var(--tophi);pointer-events:none;
}
.card.soft{box-shadow:var(--soft);}
.card.accent{

.btn{

  height:56px;border-radius:var(--r-button);
  background:linear-gradient(to bottom,color-mix(in srgb,var(--accent) 92%,#fff),color-mix(in srgb,var(--accent) 92%,#000));
  color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;
  box-shadow:0 12px 28px -10px var(--accent-glow);
  transition:transform .14s,opacity .18s;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;box-shadow:none;cursor:not-allowed;}
.btn svg{width:18px;height:18px;}
.btn.sm{height:46px;font-size:14px;}
/* buttons that are really links (the store CTA) */
a.btn,a.btn2,a.tb-btn{text-decoration:none;}
a.tb-btn.store{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border);}
a.tb-btn.store:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.danger{
  background:linear-gradient(to bottom,#f05252,#d43a3a);
  box-shadow:0 12px 28px -10px rgba(239,68,68,.35);
}
.btn2{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:52px;border-radius:var(--r-button);background:var(--fill-1);
  border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text-primary);
  transition:transform .14s,background .16s;
}
.btn2:active{transform:scale(.98);}
.btn2:disabled{opacity:.5;cursor:not-allowed;}
.btn2 svg{width:17px;height:17px;}
.btn2.sm{height:44px;font-size:13px;}
.btn2.danger{color:var(--danger);border-color:rgba(239,68,68,.35);}
.btn-text{font-size:13px;font-weight:700;color:var(--accent);padding:6px 4px;display:inline-flex;align-items:center;gap:5px;}

.btn-text svg{width:15px;height:15px;}

.chip{

}
.chip svg{width:12px;height:12px;}
.chip.accent{background:var(--accent-soft);color:var(--accent);}

.chip.tapable{cursor:pointer;transition:background .18s,color .18s;}
.chip.sel{background:var(--accent);color:#fff;}
.status{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);
  padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.1px;white-space:nowrap;
}
.status svg{width:14px;height:14px;}
.status.dense{font-size:11px;padding:3px 8px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-tertiary);}

/* Section label for copy the app renders in its own case. Never uppercased —
   uppercasing would rewrite spec copy ("Blocking go-live") and, worse, would
   rewrite data (a property address used as a group heading). */
.label{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--text-tertiary);}
.label.accent{color:var(--accent);}
.money-val{color:var(--money);text-shadow:0 0 10px var(--money-glow);font-weight:700;}

}

.iconbox{display:flex;align-items:center;justify-content:center;border-radius:var(--r-small);flex:none;}
.iconbox.s32{width:32px;height:32px;}
.iconbox.s40{width:40px;height:40px;border-radius:12px;}
.iconbox.s64{width:64px;height:64px;border-radius:var(--r-card);}
.iconbox.s72{width:72px;height:72px;border-radius:18px;}
.iconbox svg{width:18px;height:18px;}
.iconbox.s40 svg{width:22px;height:22px;}
.iconbox.s64 svg{width:28px;height:28px;}
.iconbox.s72 svg{width:32px;height:32px;}
.kpi{padding:12px 14px;}
.kpi .val{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:5px;}
.kpi .delta{font-size:11px;font-weight:600;color:var(--ok-delta);margin-top:3px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
.field label .req{color:var(--destructive);}
.input{
  width:100%;min-height:52px;border-radius:var(--r-button);border:1.5px solid transparent;
  background:var(--fill-1);padding:14px 16px;font-size:14px;font-weight:600;
  color:var(--text-primary);transition:border-color .18s,background .18s;
}

.input.err{border-color:var(--danger);}
textarea.input{min-height:auto;resize:vertical;line-height:1.5;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap .pre{position:absolute;left:15px;color:var(--text-tertiary);pointer-events:none;}
.input-wrap .pre svg{width:18px;height:18px;}
.input-wrap .suf{position:absolute;right:12px;color:var(--text-tertiary);padding:6px;}

.input-wrap .input.has-pre{padding-left:44px;}

  position:relative;z-index:6;
}

}

}

.fab svg{width:26px;height:26px;}
.fab.wide{width:auto;padding:0 18px;gap:8px;font-size:14px;font-weight:700;}

/* sections + rows */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.sec-h h3{font-size:16px;font-weight:700;margin:0;}
.row{display:flex;align-items:center;gap:12px;}
.row .grow{flex:1;min-width:0;}
.t15{font-size:15px;font-weight:700;letter-spacing:-.2px;}

.t12{font-size:12px;color:var(--text-secondary);}

.thumb.g4{background:linear-gradient(135deg,#831843,#be185d);}

.thumb.g6{background:linear-gradient(135deg,#3f3f46,#71717a);}

/* sheets + dialogs */
.overlay{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;animation:ovIn .2s ease-out;}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.sheet{
  margin-top:auto;width:100%;max-height:88%;display:flex;flex-direction:column;
  border-radius:var(--r-large) var(--r-large) 0 0;
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));
  box-shadow:0 -12px 40px -10px rgba(0,0,0,.5);animation:shIn .26s cubic-bezier(.22,.61,.36,1);
}
@keyframes shIn{from{transform:translateY(24px);opacity:.4;}to{transform:none;opacity:1;}}
.grab{width:36px;height:4px;border-radius:var(--r-pill);background:var(--text-muted);margin:10px auto 4px;flex:none;}
.sheet-h{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;flex:none;}
.sheet-h h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.25px;flex:1;}
.sheet-b{overflow-y:auto;padding:0 18px 8px;flex:1 1 auto;}
.sheet-f{padding:12px 18px calc(18px + env(safe-area-inset-bottom));flex:none;}
.dialog{
  margin:auto;width:calc(100% - 56px);border-radius:var(--r-large);padding:22px;
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));
  box-shadow:0 24px 60px -16px rgba(0,0,0,.55);animation:fadeScale .22s cubic-bezier(.22,.61,.36,1);
}
.dialog h3{margin:0 0 8px;font-size:18px;font-weight:700;letter-spacing:-.25px;}
.dialog p{margin:0 0 18px;font-size:14px;color:var(--text-secondary);line-height:1.5;}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;align-items:center;}
.dialog .acts .btn,.dialog .acts .btn2{width:auto;padding:0 18px;height:44px;}
.snackbar{
  position:absolute;left:16px;right:16px;bottom:90px;z-index:55;
  border-radius:var(--r-button);padding:13px 15px;font-size:13px;font-weight:600;line-height:1.4;
  background:#22293c;color:#F5F7FB;box-shadow:0 14px 34px -10px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:10px;animation:snIn .24s cubic-bezier(.22,.61,.36,1);
}
:root[data-corex-theme="light"] .snackbar{background:#1B2440;}
.snackbar .sb-act{margin-left:auto;color:var(--accent);font-weight:700;font-size:12.5px;flex:none;}
@keyframes snIn{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
.toast-ok{background:#14532d;}

/* drawer */
.drawer{width:290px;height:100%;background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));box-shadow:14px 0 40px -10px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:drIn .24s cubic-bezier(.22,.61,.36,1);}
@keyframes drIn{from{transform:translateX(-24px);opacity:.5;}to{transform:none;opacity:1;}}
.drawer-h{padding:54px 18px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.drawer-i{display:flex;align-items:center;gap:12px;padding:13px 18px;width:100%;text-align:left;font-size:14px;font-weight:600;}
.drawer-i svg{width:20px;height:20px;color:var(--text-secondary);flex:none;}
.drawer-i:hover{background:var(--fill-1);}
.drawer-i.red{color:var(--danger);}
.drawer-i.red svg{color:var(--danger);}

/* ---- tabbed detail pattern (NEW in 1.0.10) ---- */
.tabbar{
  display:flex;gap:2px;padding:0 8px;flex:none;position:relative;z-index:4;
  border-bottom:1px solid var(--border);background:var(--page-base);
  overflow-x:auto;scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar button{
  position:relative;padding:13px 12px 11px;font-size:12.5px;font-weight:700;
  color:var(--text-tertiary);white-space:nowrap;transition:color .18s;
}
.tabbar button[aria-selected="true"]{color:var(--accent);}
.tabbar button[aria-selected="true"]::after{
  content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);
}
.tabcount{opacity:.75;font-weight:600;}
.hero-collapse{
  position:relative;flex:none;overflow:hidden;transition:height .22s ease-out;
}
.hero-img{position:absolute;inset:0;}
.hero-img::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);}
.hero-body{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff;}
.hero-top{position:absolute;left:14px;right:14px;top:12px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.contact-hero{padding:16px;display:flex;align-items:center;gap:14px;flex:none;}

/* ---- Property Drive (NEW) ---- */
.folder-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
.folder-strip::-webkit-scrollbar{display:none;}
.doc-row{display:flex;align-items:center;gap:11px;padding:10px 0;}
.doc-row+.doc-row{border-top:1px solid var(--border);}
.doc-act{width:34px;height:34px;border-radius:var(--r-small);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none;position:relative;}
.doc-act:hover{background:var(--fill-1);color:var(--accent);}
.doc-act:disabled{opacity:.35;cursor:not-allowed;}
.doc-act svg{width:18px;height:18px;}
.tip{position:relative;}
.tip::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);right:0;z-index:20;
  background:#22293c;color:#fff;font-size:10.5px;font-weight:600;padding:5px 8px;border-radius:7px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s;max-width:200px;
}
.tip:hover::after{opacity:1;}

/* spinner */
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill-2);border-top-color:var(--accent);animation:sp .7s linear infinite;flex:none;}
.spin.sm{width:15px;height:15px;border-width:2px;}
.spin.white{border-color:rgba(255,255,255,.3);border-top-color:#fff;}
@keyframes sp{to{transform:rotate(360deg);}}
.center-pad{display:flex;align-items:center;justify-content:center;padding:34px 0;}

/* progress bar (wizard) */
.progress{display:flex;gap:5px;padding:0 14px 12px;flex:none;}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--fill-2);}
.progress i.on{background:var(--accent);}

/* misc app bits */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--fill-1);border-radius:var(--r-button);padding:0 13px;height:44px;}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:14px;font-weight:500;min-width:0;}
.searchbar svg{width:18px;height:18px;color:var(--text-tertiary);flex:none;}
.badge-n{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.golddot{width:10px;height:10px;border-radius:50%;background:var(--money);box-shadow:0 0 0 2px var(--surface-top);position:absolute;top:9px;right:9px;}
.glossy{border-bottom:1px dotted var(--text-tertiary);cursor:help;}

/* ======================= TOUR ENGINE / EXPLAIN PANEL ===================== */
.spot-layer{position:absolute;inset:0;z-index:48;pointer-events:none;}
.spot-mask{position:absolute;inset:0;background:rgba(4,8,18,.72);
  -webkit-mask-image:var(--spot-mask);mask-image:var(--spot-mask);}
.spot-ring{position:absolute;border-radius:16px;box-shadow:0 0 0 2px var(--accent),0 0 26px 6px var(--accent-glow);transition:all .28s cubic-bezier(.22,.61,.36,1);}
.coach{
  position:absolute;z-index:49;max-width:250px;padding:12px 14px;border-radius:var(--r-card);
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));

}
.coach h5{margin:0 0 5px;font-size:13px;font-weight:700;letter-spacing:-.1px;}
.coach p{margin:0;font-size:12px;line-height:1.5;color:var(--text-secondary);}
.coach .arw{position:absolute;width:10px;height:10px;transform:rotate(45deg);background:var(--surface-top);border:1px solid var(--accent-border);}

.panel{
  border-radius:var(--r-card);padding:20px 22px;
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));
  box-shadow:var(--soft);border:var(--card-border);
}
.panel+.panel{margin-top:14px;}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.25;}
.panel h4{margin:18px 0 6px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);}
.panel p{margin:0 0 11px;font-size:14px;line-height:1.62;color:var(--text-secondary);}
.panel p:last-child{margin-bottom:0;}
.panel ul{margin:0 0 11px;padding-left:18px;font-size:14px;line-height:1.62;color:var(--text-secondary);}
.panel li{margin-bottom:5px;}
.panel strong{color:var(--text-primary);font-weight:700;}
.panel code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--fill-2);padding:1px 5px;border-radius:5px;color:var(--text-primary);}
.panel .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.callout{
  border-radius:var(--r-small);padding:12px 14px;margin:0 0 12px;
  background:var(--money-soft);border-left:3px solid var(--money);
  font-size:13.5px;line-height:1.55;color:var(--text-secondary);
}
.callout.gotcha{background:rgba(239,68,68,.10);border-left-color:var(--danger);}
.callout.new{background:var(--accent-soft);border-left-color:var(--accent);}
.callout b{color:var(--text-primary);}
.try{
  display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-small);padding:12px 14px;
  background:var(--accent-soft);border:1px solid var(--accent-border);font-size:13.5px;line-height:1.55;
  color:var(--text-primary);margin-top:12px;
}
.try svg{width:17px;height:17px;color:var(--accent);flex:none;margin-top:1px;}
.try.done{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);}
.try.done svg{color:var(--ok);}
.nav-row{display:flex;align-items:center;gap:9px;margin-top:16px;flex-wrap:wrap;}
.nav-row .grow{flex:1;}
.pbar{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;margin-top:14px;}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.demo-ctl{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.demo-ctl .tb-btn{height:30px;font-size:11.5px;}

.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.legend-item{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-secondary);}
.legend-sw{width:16px;height:16px;border-radius:5px;flex:none;}
.gloss-pop{
  position:fixed;z-index:200;max-width:290px;padding:12px 14px;border-radius:var(--r-card);
  background:linear-gradient(to bottom,var(--surface-top),var(--surface-base));
  box-shadow:0 18px 44px -12px rgba(0,0,0,.5);border:1px solid var(--border);
  font-size:12.5px;line-height:1.55;color:var(--text-secondary);
}
.gloss-pop b{display:block;color:var(--text-primary);font-size:13px;margin-bottom:4px;}
.gesture{display:flex;align-items:center;gap:12px;padding:10px 0;}
.gesture+.gesture{border-top:1px solid var(--border);}
.gest-anim{width:56px;height:38px;border-radius:8px;background:var(--fill-2);position:relative;overflow:hidden;flex:none;}
.gest-dot{position:absolute;top:13px;left:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:.9;}
.gest-r .gest-dot{animation:gr 1.8s ease-in-out infinite;}
.gest-l .gest-dot{animation:gl 1.8s ease-in-out infinite;}
.gest-u .gest-dot{animation:gu 1.8s ease-in-out infinite;}
.gest-p .gest-dot{animation:gp 1.6s ease-in-out infinite;left:22px;}
@keyframes gr{0%,15%{transform:none;opacity:.9;}60%,100%{transform:translateX(34px);opacity:.2;}}
@keyframes gl{0%,15%{transform:translateX(34px);opacity:.9;}60%,100%{transform:none;opacity:.2;}}
@keyframes gu{0%,15%{transform:translateY(12px);opacity:.9;}60%,100%{transform:translateY(-14px);opacity:.2;}}
@keyframes gp{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.7);opacity:.5;}}
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.cmp-table th{text-align:left;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-tertiary);padding:6px 8px;border-bottom:1px solid var(--border);}
.cmp-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:top;}
.cmp-table td:first-child{color:var(--text-primary);font-weight:600;}

/* §0.2 — label case. Title-cases machine values WITHOUT lowercasing anything,
   so existing capitals (acronyms) survive: FICA stays FICA, P24 stays P24. */
function labelCase(v){
  if (v === null || v === undefined) return '';
  var s = String(v).replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  return s.split(' ').map(function(w){
    return w.charAt(0).toUpperCase() + w.slice(1);   // never .toLowerCase()
  }).join(' ');
}
/* Sentence variant: first word raised, the rest left exactly as-is
   (so not_started -> "Not started" inside a sentence). */
function sentenceCase(v){
  var s = String(v == null ? '' : v).replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function dash(v){ return (v === null || v === undefined || v === '' ) ? '—' : v; }
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function money(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return 'R ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function moneyShort(n){
  if (n >= 1000000) return 'R ' + (n/1000000).toFixed(1).replace(/\.0$/,'') + 'm';
  if (n >= 1000) return 'R ' + Math.round(n/1000) + 'k';
  return money(n);
}

function fmtDate(d){ return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateLong(d){ return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtTime(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }

function relTime(ms){
  var diff = Date.now() - ms;
  var m = Math.round(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.round(m/60);
  if (h < 24) return h + 'h ago';
  var d = Math.round(h/24);
  if (d < 30) return d + 'd ago';
  return Math.round(d/30) + 'mo ago';
}
function relFuture(ms){
  var diff = ms - Date.now();
  if (diff <= 60000) return 'Now';
  var m = Math.round(diff/60000);
  if (m < 60) return 'in ' + m + ' min';
  var h = Math.floor(m/60), r = m % 60;
  if (r === 0) return 'in ' + h + 'h';
  return 'in ' + h + 'h ' + r + 'm';
}
function initials(name){
  var p = String(name).trim().split(/\s+/);
  return ((p[0]||'')[0] || '' ).toUpperCase() + ((p[1]||'')[0] || '').toUpperCase();
}
function fileSize(bytes){
  if (bytes >= 1048576) return (bytes/1048576).toFixed(1) + ' MB';
  if (bytes >= 1024) return Math.round(bytes/1024) + ' KB';
  return bytes + ' B';
}

/* index helpers */
function prop(id){ return DB.properties.filter(function(p){ return p.id === id; })[0]; }
function contact(id){ return DB.contacts.filter(function(c){ return c.id === id; })[0]; }
function cname(c){ return c ? (c.first + ' ' + c.last) : '—'; }

/* compliance verdict, unchanged in content — now lives on its own tab (§2.1) */
function gates(p){
  var c = p.compliance;
  return [
    { key:'authority', ok:c.authority, label:'Authority to market', detail:c.authority ? 'Signed mandate on file' : 'No signed mandate on file', action:'Send mandate for signature' },

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-a]');
  if (!t) return;
  var stop = ev.target.closest('[data-stop]');
  var a = t.getAttribute('data-a');
  if (a === 'overlay-bg'){
    if (stop) return;                       /* clicks inside the sheet/dialog do not dismiss */
    if (S.overlay && S.overlay.name === 'update-available'){ ACTIONS['update-later'](); return; }
    if (S.overlay && S.overlay.noDismiss) return;
    S.overlay = null; S.drawer = false; render(); return;
  }
  var fn = ACTIONS[a];
  if (!fn) return;
  ev.preventDefault();
  fn(t.getAttribute('data-p'), ev, t);
});
document.addEventListener('input', function(ev){
  var t = ev.target.closest('[data-in]');
  if (!t) return;
  var fn = ACTIONS['in:' + t.getAttribute('data-in')];
  if (fn) fn(t.value, ev, t);
});

/* the login cascade — agent, then client lookup */
ACTIONS['login'] = function(){
  var email = (S.loginEmail || '').trim().toLowerCase();
  S.loginErr = null;
  if (!email){ S.loginErr = 'unknown'; render(); return; }
  if (S.deletedAccount && email === AGENT.email){ S.loginErr = 'deleted'; render(); return; }
  S.loginBusy = true; render();
  setTimeout(function(){
    S.loginBusy = false;
    if (email === AGENT.email){
      if (S.loginPw && S.loginPw.length < 4){ S.loginErr = 'wrongpw'; render(); return; }
      afterAgentLogin();
    } else if (email === CLIENT.email){
      enterClient();
    } else if (email.indexOf('@') > 0 && email.indexOf('new') === 0){
      S.loginErr = 'inactive'; render();
    } else {
      S.loginErr = 'unknown'; render();
    }
  }, 520);
};

ACTIONS['demo-client'] = function(){ S.loginEmail = CLIENT.email; S.loginErr = null; enterClient(); };

  if (!skipBioOffer && !S.biometricEnabled && !S.biometricOffered && S.biometricAvailable){
    setTimeout(function(){ dialog('enable-biometric'); }, 500);
    return;
  }
  maybeOptionalUpdate();
}

/* §5.2 — status no longer locks an event. Only its source does, and the message
   now says which of the two reasons applies. */
function eventLock(e){
  if (e.private && e.ownerId && e.ownerId !== 'me') return 'This is someone else’s private event.';
  if (e.source) return 'This event comes from another record and is kept in sync with it — change it at the source.';

}

function calBody(){

function eventsOn(d){ return DB.events.filter(function(e){ return sameDay(e.start, d); }).sort(function(a,b){ return a.start-b.start; }); }
function eventCard(e){
  return '<div class="card tap" data-a="open-event" data-p="' + e.id + '"><div class="row">'

function calDay(){
  var d = S.calDate, evs = eventsOn(d);
  return '<div class="row" style="justify-content:center;gap:12px;margin:6px 0 14px">'
    + '<button class="ico" data-a="cal-move" data-p="-1">' + icon('chevron-left') + '</button>'
    + '<div class="t15">' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</div>'
    + '<button class="ico" data-a="cal-move" data-p="1">' + icon('chevron-right') + '</button></div>'
    + (evs.length ? '<div class="stack">' + evs.map(eventCard).join('') + '</div>'
      : '<div class="card"><div class="t14" style="color:var(--text-secondary)">No events</div></div>');
}
function calWeek(){
  var d = S.calDate, dow = (d.getDay() + 6) % 7, mon = addDays(d, -dow);
  var strip = '<div class="row" style="gap:5px;margin:6px 0 16px">';
  for (var i = 0; i < 7; i++){
    var day = addDays(mon, i), sel = sameDay(day, d), has = eventsOn(day).length;
    strip += '<button data-a="cal-pick" data-p="' + iso(day) + '" style="flex:1;padding:9px 0;border-radius:var(--r-small);'
      + (sel ? 'background:var(--accent-soft);color:var(--accent)' : 'background:var(--fill-1);color:var(--text-secondary)') + '">'
      + '<div style="font-size:10px;font-weight:700">' + DAY3[day.getDay()][0] + '</div>'
      + '<div style="font-size:14px;font-weight:700;margin:3px 0">' + day.getDate() + '</div>'
      + '<div style="height:5px">' + (has ? '<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent)"></span>' : '') + '</div>'
      + '</button>';
  }
  strip += '</div>';
  var evs = eventsOn(d);
  return strip + (evs.length ? '<div class="stack">' + evs.map(eventCard).join('') + '</div>'
    : '<div class="card"><div class="t14" style="color:var(--text-secondary)">No events</div></div>');
}
function calMonth(){
  var d = S.calDate, first = new Date(d.getFullYear(), d.getMonth(), 1);
  var start = addDays(first, -((first.getDay() + 6) % 7));
  var h = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px">'
    + ['M','T','W','T','F','S','S'].map(function(x){ return '<div class="t12t" style="text-align:center;font-weight:700">' + x + '</div>'; }).join('')
    + '</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  for (var i = 0; i < 42; i++){
    var day = addDays(start, i), evs = eventsOn(day);
    var isToday = sameDay(day, new Date());
    var isSel = S.calSelected && sameDay(day, new Date(S.calSelected));
    var out = day.getMonth() !== d.getMonth();
    h += '<button data-a="cal-select" data-p="' + iso(day) + '" style="aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;'
      + 'align-items:center;justify-content:center;gap:2px;'
      + (isToday ? 'background:var(--accent);color:#fff;' : (isSel ? 'background:var(--navy);color:#fff;' : ''))
      + (out ? 'opacity:.32;' : '') + '">'
      + '<span style="font-size:12px;font-weight:' + (isToday?'700':'600') + '">' + day.getDate() + '</span>'
      + '<span style="display:flex;gap:2px;height:4px">' + evs.slice(0,3).map(function(e){
          return '<i style="width:4px;height:4px;border-radius:50%;background:' + (isToday||isSel ? '#fff' : 'var(' + e.color + ')') + '"></i>'; }).join('') + '</span>'
      + '</button>';
  }
  h += '</div>';
  if (S.calSelected){
    var sd = new Date(S.calSelected), se = eventsOn(sd);
    h += '<div class="card" style="margin-top:14px"><div class="t14">' + fmtDateLong(sd) + '</div>'
      + '<div class="t12t" style="margin-top:4px">' + (se.length ? se.length + ' events' : 'No events') + '</div></div>';
    if (se.length) h += '<div class="stack" style="margin-top:10px">' + se.map(eventCard).join('') + '</div>';
  } else {
    h += '<div class="card" style="margin-top:14px"><div class="t14" style="color:var(--text-secondary)">Tap a day to see events</div></div>';
  }
  return h;
}
function calAgenda(){
  var now = new Date(), end = addDays(now, 60);
  var evs = DB.events.filter(function(e){ return e.start >= new Date(now.getFullYear(),now.getMonth(),now.getDate()) && e.start <= end; })
    .sort(function(a,b){ return a.start - b.start; });
  if (!evs.length) return '<div class="card"><div class="t14" style="color:var(--text-secondary)">No events this month</div></div>';
  var out = '', last = '';
  evs.forEach(function(e){
    var k = iso(e.start);
    if (k !== last){
      last = k;
      var isT = sameDay(e.start, now);
      out += '<div class="row" style="gap:6px;margin:18px 0 8px">'
        + (isT ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></span>' : '')
        + '<div class="label' + (isT ? ' accent' : '') + '">' + (isT ? 'Today · ' : '') + DAYS[e.start.getDay()] + ' · ' + e.start.getDate() + ' ' + MONTHS[e.start.getMonth()] + '</div></div>';
    }
    out += eventCard(e);
  });
  return out;
}
ACTIONS['cal-view'] = function(v){ S.calView = v; render(); };
ACTIONS['cal-move'] = function(n){
  var step = S.calView === 'week' ? 7 : (S.calView === 'month' ? 0 : 1);
  if (S.calView === 'month'){ S.calDate = new Date(S.calDate.getFullYear(), S.calDate.getMonth() + Number(n), 1); }
  else S.calDate = addDays(S.calDate, Number(n) * (step || 1));
  render();
};

function archivedList(){
  if (!DB.archived.length) return '<div class="card"><div class="t14" style="color:var(--text-secondary)">No archived tasks.</div></div>';
  var groups = {}, out = '';
  DB.archived.forEach(function(t){
    var k = MON[t.archivedAt.getMonth()] + ' ' + t.archivedAt.getDate() + ', ' + t.archivedAt.getFullYear();
    (groups[k] = groups[k] || []).push(t);
  });
  Object.keys(groups).forEach(function(k){
    out += '<div class="label" style="margin:18px 0 8px">' + esc(k) + '</div><div class="stack-s">'
      + groups[k].map(function(t){
        return '<div class="card"><div class="row"><div class="grow"><div class="t14 clip">' + esc(t.title) + '</div>'
          + '<div style="margin-top:6px">' + pillarChip(t.pillar) + '</div></div>'
          + '<button class="btn-text" data-a="restore-task" data-p="' + t.id + '">Restore</button></div></div>'; }).join('')
      + '</div>';
  });
  return out;
}

/* ---------- PROPERTIES LIST ---------- */
function filteredProps(){
  var q = S.propSearch.toLowerCase();
  return DB.properties.filter(function(p){
    if (S.propScope === 'mine' && !p.mine) return false;
    if (q && p.title.toLowerCase().indexOf(q) < 0) return false;
    var f = S.propFilters;
    if (f.suburb && p.suburb !== f.suburb) return false;
    if (f.status && p.status !== f.status) return false;
    if (f.type && p.type !== f.type) return false;
    if (f.min && p.price < f.min) return false;
    if (f.max && p.price > f.max) return false;
    return true;
  });
}
function filterCount(){ return Object.keys(S.propFilters).filter(function(k){ return S.propFilters[k]; }).length; }

function tabLabel(name, count){

    : esc(name) + ' <span class="tabcount">· ' + count + '</span>';
}
function tabBar(tabs, current, action){
  return '<div class="tabbar">' + tabs.map(function(t){
    return '<button data-a="' + action + '" data-p="' + t.k + '" aria-selected="' + (current === t.k) + '">'
      + tabLabel(t.l, t.n) + '</button>';
  }).join('') + '</div>';
}
function propTabs(p){
  var contactCount = p.contacts.length + p.agents.length + (p.owner ? 1 : 0);

    { k:'contacts', l:'Contacts', n:contactCount },
    { k:'drive', l:'Drive', n:(p.drive && p.drive.files ? p.drive.files.length : 0) }
  ];
  if (p.rental) tabs.push({ k:'inspections', l:'Inspections' });   /* rentals only */
  return tabs;

        + '<div class="avatar round" style="width:36px;height:36px;font-size:12px">' + initials(s.name) + '</div>'
        + '<div class="grow t14">' + esc(s.name) + '</div>'
        + '<span class="status dense" style="background:' + (ok ? 'rgba(34,197,94,.14);color:var(--ok)' : 'rgba(245,158,11,.14);color:var(--warn)') + '">'
        + (ok ? 'FICA approved' : 'FICA pending') + '</span></div></div>'; }).join('')
    + '</div>';

  h += '<div class="sec-h"><h3>Next actions</h3></div><div class="card">'
    + (blockers.length
        ? '<ul style="margin:0;padding-left:16px;font-size:13px;line-height:1.7;color:var(--text-secondary)">'

  } else {
    h += '<button class="btn" data-a="send-to-market" data-p="' + p.id + '"' + (ready ? '' : ' disabled') + '>Send Authority to Market</button>'

/* ==========================================================================
   §2.3 — THE PROPERTY DRIVE (new "Drive" tab)
   A read-only, per-property view of documents filed against the listing on the
   web. Viewing and downloading only — uploading, tagging and deleting are
   web-only. The card has no title heading: the "Drive" tab label is its name.
   ========================================================================== */
var KIND = {
  pdf:   { i:'file-type-pdf', c:'#EF4444' },
  image: { i:'photo',         c:'#8B5CF6' },
  doc:   { i:'file-text',     c:'#3B82F6' },
  sheet: { i:'table',         c:'#22C55E' },
  generic:{ i:'file-text',    c:'#8890A4' }
};
function kindOf(k){ return KIND[k] || KIND.generic; }

function driveFolders(files){
  var counts = {}, order = [];
  files.forEach(function(f){
    var k = f.folder || 'Unfiled';                 /* Unfiled only exists if the server sends one */
    if (counts[k] === undefined){ counts[k] = 0; order.push(k); }
    counts[k]++;
  });
  return order.map(function(k){ return { label:k, n:counts[k] }; });
}

function driveTab(p){
  var d = p.drive || { state:'ready', files:[] };

  if (d.state === 'loading') return spinnerBlock('');
  if (d.state === 'error'){
    return '<div class="empty" style="padding-top:44px">'
      + '<div class="iconbox s72" style="background:var(--fill-2);color:var(--text-tertiary)">' + icon('cloud-off',32) + '</div>'
      + '<div class="t18">Couldn’t load files.</div>'
      + '<button class="btn2 sm" data-a="drive-retry" style="max-width:170px;margin-top:6px">' + icon('refresh') + 'Retry</button></div>';
  }
  if (!d.files.length){
    return '<div style="margin-top:14px"></div><div class="card">'
      + '<div class="center-pad" style="flex-direction:column;gap:12px;padding:26px 0">'
      + '<div class="iconbox s72" style="background:var(--fill-2);color:var(--text-tertiary)">' + icon('folder',32) + '</div>'
      + '<div class="t14" style="color:var(--text-secondary)">No files on this property yet.</div></div></div>';
  }

  var folders = driveFolders(d.files);
  var sel = S.driveFolder;
  var shown = sel === 'All' ? d.files : d.files.filter(function(f){ return (f.folder || 'Unfiled') === sel; });

  var chips = '<div class="folder-strip">'
    + '<button class="chip tapable' + (sel === 'All' ? ' sel' : '') + '" data-a="drive-folder" data-p="All">'
    + 'All <span style="opacity:.75">' + d.files.length + '</span></button>'
    + folders.filter(function(f){ return f.n > 0; }).map(function(f){        /* a count of 0 is hidden */
        return '<button class="chip tapable' + (sel === f.label ? ' sel' : '') + '" data-a="drive-folder" data-p="' + esc(f.label) + '">'
          + esc(f.label) + ' <span style="opacity:.75">' + f.n + '</span></button>'; }).join('')
    + '</div>';

  var rows = shown.length
    ? shown.map(function(f){ return driveRow(f); }).join('')
    : '<div class="center-pad" style="padding:26px 0"><div class="t14" style="color:var(--text-secondary)">No files in this folder.</div></div>';

  return '<div style="margin-top:14px"></div><div class="card">' + chips + rows + '</div>'
    + '<div class="t12t" style="margin-top:12px;line-height:1.6;padding:0 2px">'
    + 'Files are added, tagged and deleted on the CoreX website. This tab views and downloads them.</div>';
}
function driveRow(f){
  var k = kindOf(f.kind);
  var busy = S.driveBusy === f.id;
  var off = S.downloadsOff;
  var meta = joinDot([ fileSize(f.bytes), f.by, relTime(f.at) ]);
  return '<div class="doc-row">'
    + '<div class="iconbox s40" style="background:color-mix(in srgb,' + k.c + ' 14%,transparent);color:' + k.c + '">' + icon(k.i) + '</div>'
    + '<div class="grow" style="min-width:0"><div class="t14 clip">' + esc(f.name) + '</div>'
    + '<div class="t12t clip" style="margin-top:3px">' + esc(meta) + '</div></div>'
    + (busy
        ? '<div class="doc-act"><span class="spin sm"></span></div>'
        : '<button class="doc-act tip" data-tip="' + (off ? 'Downloads are switched off for your account' : 'Download') + '"'
          + ' data-a="drive-download" data-p="' + f.id + '"' + (off ? ' disabled' : '') + ' aria-label="Download">'
          + icon('download') + '</button>')
    + '<button class="doc-act tip" data-tip="' + (off ? 'Downloads are switched off for your account' : 'Share') + '"'
    + ' data-a="drive-share" data-p="' + f.id + '"' + (off ? ' disabled' : '') + ' aria-label="Share">' + icon('share') + '</button>'
    + '</div>';
}
ACTIONS['drive-folder'] = function(v){ S.driveFolder = v; render(); tourCheck('drive-folder'); };
ACTIONS['drive-retry'] = function(){
  var p = prop(S.propId);
  p.drive.state = 'loading'; render();

/* ==========================================================================
   §3 — THE GALLERY UPLOAD SHEET (rebuilt mechanics)
   Preparing → durable queue → up to 3 concurrent uploads, 3 attempts each.
   ========================================================================== */
function openUpload(pid){
  S.upload = S.upload || { queue:[], failed:[], tag:'No tag', preparing:false, uploading:false, done:0, pid:pid };
  S.upload.pid = pid;
  sheet('upload');
}
ACTIONS['open-upload'] = function(){ openUpload(S.propId || 'p2'); };

function propTags(p){
  /* photo tags are derived from the spaces created in step 3 */
  var base = ['Bedroom','Bathroom','Kitchen','Lounge','Garage','Pool','Garden'];
  return p && p.photos > 3 ? base : base.slice(0,3);
}
SHEETS['upload'] = function(){
  if (!S.upload) S.upload = { queue:[], failed:[], tag:'No tag', preparing:false, uploading:false, done:0, pid:S.propId || 'p2' };
  var u = S.upload, p = prop(u.pid) || DB.properties[1];
  var tags = propTags(p);
  var header = u.uploading ? ('Uploaded ' + u.done + ' of ' + u.queue.length + '…') : (u.queue.length + ' selected');

  var body = '<div class="label" style="margin-bottom:8px">Tag this photo</div>'
    + '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">'
    + tags.map(function(t){
        return '<button class="chip tapable' + (u.tag === t ? ' sel' : '') + '" data-a="up-tag" data-p="' + t + '">'
          + esc(t) + ' · ' + Math.max(0, p.photos - tags.indexOf(t) * 2) + '</button>'; }).join('')
    + '<button class="chip tapable' + (u.tag === 'No tag' ? ' sel' : '') + '" data-a="up-tag" data-p="No tag">No tag</button>'
    + '</div>'
    + (tags.length ? '' : '<div class="hint-line" style="margin-bottom:12px">This property has no spaces yet — photos will upload to Unsorted.</div>')

    + '<div class="divider"></div>'
    + '<div class="row" style="gap:8px">'
    + ['Multi Capture','Native','Gallery'].map(function(s){
        return '<button class="btn2 sm" data-a="up-source" data-p="' + s + '" style="flex:1;font-size:12px"'
          + (u.preparing ? ' disabled' : '') + '>' + esc(s) + '</button>'; }).join('')
    + '</div>';

  /* NEW: the "Preparing" state — downscale + orientation-correct before queueing */
  if (u.preparing){
    body += '<div class="row" style="gap:10px;margin-top:16px;justify-content:center">'
      + '<span class="spin sm"></span><span class="t14" style="color:var(--text-secondary)">Preparing photos…</span></div>';
  }

  if (u.queue.length){
    body += '<div class="divider"></div>'
      + '<div class="label" style="margin-bottom:9px">' + esc(header) + '</div>'
      + '<div class="row" style="gap:8px;flex-wrap:wrap">'
      + u.queue.map(function(q,i){
          return '<div class="thumb g' + (i % 8) + '" style="width:90px;height:90px;position:relative">'
            + (q.state === 'uploading' ? '<span class="spin sm" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>' : icon('photo'))
            + (q.state === 'done' ? '<span style="position:absolute;top:5px;left:5px;color:#fff">' + icon('circle-check',16) + '</span>' : '')
            + '<button style="position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center" data-a="up-remove" data-p="' + i + '">'
            + icon('x',12) + '</button></div>'; }).join('')
      + '</div>';
  }

  if (u.failed.length){
    body += '<div class="divider"></div>'
      + '<div class="row" style="margin-bottom:8px">'
      + '<div class="label grow" style="color:var(--danger)">' + u.failed.length + ' photo' + (u.failed.length>1?'s':'') + ' didn’t upload — tap to retry</div>'
      + (u.failed.length > 1 && !u.uploading
          ? '<button class="btn-text danger" data-a="up-retry-all">Retry all</button>' : '')
      + '</div>'
      + u.failed.map(function(f,i){
          return '<div class="row" style="padding:7px 0;border-top:1px solid var(--border)">'

            + '<button class="btn-text" data-a="up-retry" data-p="' + i + '">Retry</button></div>'; }).join('');
  }

  return sheetWrap('Upload Photos', body,
    '<button class="btn" data-a="up-go"' + (!u.queue.length || u.uploading || u.preparing ? ' disabled' : '') + '>'
    + 'Upload ' + u.queue.length + ' photo(s)</button>', { tall:true });

ACTIONS['up-source'] = function(src){
  var u = S.upload;
  u.preparing = true; render();
  /* downscale, orientation-correct, HEIC → JPEG — then they enter the durable queue */
  setTimeout(function(){
    u.preparing = false;
    var n = src === 'Gallery' ? 5 : (src === 'Multi Capture' ? 3 : 1);
    for (var i = 0; i < n; i++) u.queue.push({ name:'IMG_' + (4820 + u.queue.length) + '.jpg', state:'queued' });
    if (src === 'Gallery' && u.queue.length > 7){
      snack('Couldn’t add 2 photos — device storage may be full');
    }
    render();
    tourCheck('photos-prepared');
  }, 1100);
};
ACTIONS['up-go'] = function(){
  var u = S.upload;
  u.uploading = true; u.done = 0; u.failed = [];
  render();
  /* up to 3 concurrent, up to 3 attempts each with a short backoff */
  var idx = 0, running = 0, total = u.queue.length;
  function pump(){
    while (running < 3 && idx < u.queue.length){
      (function(q){
        running++; q.state = 'uploading'; render();
        setTimeout(function(){
          running--;
          /* one deliberate failure so the retry path is demonstrable */
          var fail = q.name.slice(-5,-4) === '2' && !q.retried;
          if (fail){ q.state = 'failed'; u.failed.push({ name:q.name, err:'Upload failed after 3 attempts', ref:q }); }
          else { q.state = 'done'; u.done++; }
          render();
          if (idx < u.queue.length) pump();
          else if (running === 0) finish();
        }, 500 + Math.random() * 700);
      })(u.queue[idx++]);
    }
  }
  function finish(){
    u.uploading = false;
    var ok = u.done;
    if (u.failed.length){
      snack(u.failed.length + ' photo' + (u.failed.length>1?'s':'') + ' didn’t upload — tap Retry below');
    } else {
      snack(ok + ' photos uploaded', { tone:'ok' });
      var p = prop(u.pid);
      if (p){ p.photos = Math.min(12, p.photos + ok); if (p.photos >= 6) p.compliance.photos = true; }
      u.queue = [];
    }
    render();
    tourCheck('upload-done');
  }
  pump();
};
ACTIONS['up-retry'] = function(i){
  var u = S.upload, f = u.failed[Number(i)];
  if (!f) return;
  f.ref.retried = true; f.ref.state = 'uploading';
  u.failed.splice(Number(i),1); render();
  setTimeout(function(){
    f.ref.state = 'done'; u.done++;
    if (!u.failed.length){
      snack(u.done + ' photos uploaded', { tone:'ok' });
      var p = prop(u.pid);
      if (p){ p.photos = Math.min(12, p.photos + u.done); if (p.photos >= 6) p.compliance.photos = true; }
      u.queue = [];
    }
    render();
    tourCheck('upload-retried');
  }, 700);
};
ACTIONS['up-retry-all'] = function(){
  var u = S.upload, n = u.failed.length;
  u.failed.forEach(function(f){ f.ref.retried = true; f.ref.state = 'uploading'; });
  u.failed = []; render();
  setTimeout(function(){
    u.queue.forEach(function(q){ if (q.state === 'uploading'){ q.state = 'done'; u.done++; } });
    snack(u.done + ' photos uploaded', { tone:'ok' });
    var p = prop(u.pid);
    if (p){ p.photos = Math.min(12, p.photos + u.done); if (p.photos >= 6) p.compliance.photos = true; }
    u.queue = [];
    render();
    tourCheck('upload-retried');
  }, 900);
};

SCREENS['match'] = function(){
  var m = DB.matches.filter(function(x){ return x.id === S.matchId; })[0];
  if (!m) return statusbar() + appbar({ back:true, title:'Match' }) + '<div class="scroll"></div>';
  var c = contact(m.contactId);
  var tiers = [
    { l:'Strong matches', min:80, c:'var(--ok)' },
    { l:'Good matches', min:65, c:'var(--info)' },
    { l:'Fair matches', min:50, c:'var(--warn)' }
  ];
  var h = statusbar() + appbar({ back:true, title:m.name })
    + '<div class="scroll"><div class="pad capped">'
    + '<div style="margin-top:14px"></div><div class="card"><div class="row" style="margin-bottom:10px">'
    + '<div class="grow t14">' + esc(cname(c)) + '</div>' + statusChip(m.status, true) + '</div>'
    + '<div class="t12" style="line-height:1.6">' + esc(joinDot([labelCase(m.listingType), m.suburbs.join(', '), money(m.min) + ' – ' + money(m.max), m.beds + '+ beds'])) + '</div>'
    + (m.notes ? '<div class="t12t" style="margin-top:8px;line-height:1.6">' + esc(m.notes) + '</div>' : '')
    + '</div>'
    + '<div class="callout new" style="margin-top:14px"><b>Not AI.</b> Core Matches is a deterministic scoring engine — price, beds, suburb and features. Nothing here is generated by a model.</div>';

  var any = false;
  tiers.forEach(function(t, i){
    var max = i === 0 ? 101 : tiers[i-1].min;
    var rs = m.results.filter(function(r){ return r.score >= t.min && r.score < max; });
    if (!rs.length) return;
    any = true;
    h += '<div class="sec-h"><h3 style="font-size:14px;color:' + t.c + '">' + t.l + '</h3></div><div class="stack-s">'
      + rs.map(function(r){
        var p = prop(r.pid);
        return '<div class="card tap" data-a="open-prop" data-p="' + p.id + '"><div class="row">'
          + '<div class="thumb g' + p.g + '" style="width:56px;height:56px">' + icon('building-skyscraper') + '</div>'
          + '<div class="grow"><div class="t14 clip2">' + esc(p.title) + '</div>'
          + '<div class="money-val" style="font-size:13px;margin-top:4px">' + money(p.price) + '</div></div>'
          + '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">'
          + '<span class="chip" style="background:color-mix(in srgb,' + t.c + ' 14%,transparent);color:' + t.c + '">' + r.score + '%</span>'
          + (r.reaction ? reactionChip(r.reaction) : '') + '</div></div>'
          + (r.why ? '<div class="t12t" style="margin-top:8px;font-style:italic">“' + esc(r.why) + '”</div>' : '')
          + '</div>'; }).join('') + '</div>';

  if (!any) h += '<div class="card" style="margin-top:14px"><div class="t12" style="line-height:1.6">Nothing scored 50% or higher for this match. Adjust the filters to widen the search.</div></div>';

  h += '<div style="margin-top:18px"></div>'
    + '<button class="btn" data-a="wa-share" data-p="' + m.id + '">' + icon('brand-whatsapp') + 'Send via WhatsApp</button>'
    + '<button class="btn2" data-a="noop" style="margin-top:10px">' + icon('external') + 'Client Page</button>'
    + '</div></div>' + bottomnav();
  return h;
};

function qrSvg(){
  var n = 21, cells = '';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
    var finder = (x < 7 && y < 7) || (x > n-8 && y < 7) || (x < 7 && y > n-8);
    var on = finder
      ? !((x>=2&&x<=4&&y>=2&&y<=4) === false && ((x===1||x===5||y===1||y===5) && !(x===0||x===6||y===0||y===6)))
      : ((x * 7 + y * 13 + ((x*y) % 5)) % 3 === 0);
    if (finder){
      var lx = x < 7 ? x : x - (n-7), ly = y < 7 ? y : y - (n-7);
      on = (lx===0||lx===6||ly===0||ly===6) || (lx>=2&&lx<=4&&ly>=2&&ly<=4);
    }
    if (on) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
  }
  return '<svg viewBox="0 0 21 21" style="width:100%;height:100%" fill="#0B1426" aria-label="QR code">' + cells + '</svg>';
}

/* The first press asks for access and does NOT record — press again once granted. */
ACTIONS['ellie-tap'] = function(){
  var e = S.ellie;
  if (!e.micGranted){
    if (e.permanentlyDenied){
      snack('Microphone access is off for CoreX. Turn it on in Settings.', { action:'Settings', act:'noop', ms:5000 });
      return;
    }
    e.micGranted = true; e.asked = true;
    render();
    snack('Microphone on — hold the mic and speak.', { tone:'ok' });
    tourCheck('mic-granted');
    return;
  }
  /* granted: a plain tap is too short to be a hold */
  snack('Hold to talk — press and hold the mic');
};
/* real press-and-hold */
document.addEventListener('pointerdown', function(ev){
  var m = ev.target.closest('#mic');
  if (!m || !S.ellie.micGranted || S.ellie.state === 'sending') return;
  S.ellie.holdStart = Date.now();
  S.ellie.state = 'recording';
  render();
});
document.addEventListener('pointerup', function(){
  var e = S.ellie;
  if (e.state !== 'recording') return;
  var held = Date.now() - e.holdStart;
  e.state = 'idle';
  if (held < 400){ render(); snack('Hold to talk — press and hold the mic'); return; }
  e.state = 'sending'; render();
  setTimeout(function(){
    e.state = 'idle';
    e.transcript = 'Book a viewing with John at 12 Beach Road tomorrow at 11am';
    render();
    sheet('ellie-result');
    tourCheck('ellie-booked');
  }, 1200);
});

var CHAPTERS = [
{ group:'Getting started', n:1, title:'Welcome — what CoreX actually is', steps:[
  { t:'A real-estate operating system',
    go:toScreen('login'),
    body:'<p>CoreX OS is the system your agency runs on. This page is a working replica of the mobile app — every screen, every button, every piece of copy. Nothing talks to a server, so you can press anything without consequence.</p>'
      + '<p>Everything in CoreX hangs off <strong>four pillars</strong>: Property, Contact, Deal and Agent. Every task, event and notification links to at least one of them. An item that links to nothing is treated as a bug, not a feature.</p>'
      + '<div class="callout"><b>The product philosophy.</b> Agents open CoreX to answer one question — “what do I do now?” So the app is action-first. The old version was eighteen stacked scorecards and agents hated the noise. Everything now is something you can complete, reschedule, skip or open.</div>'
      + '<p>There are two experiences behind one login: the <strong>agent app</strong> and the <strong>client portal</strong>. The switch in the top bar flips between them.</p>'
      + '<h4>The real thing</h4>'
      + '<p>When you are done here, install it and sign in with your own credentials — everything you practise on this page works the same way there.</p>'
      + '<p>' + storeLink('btn2 sm', 'Get CoreX OS on Google Play', true) + '</p>' },
  { t:'What’s new in 1.0.10',
    go:toScreen('login'),
    body:'<p>You’re looking at version <strong>1.0.10 (18)</strong>. If you learned the app on 1.0.0, five things moved:</p>'
      + '<ul><li><strong>Property and Contact detail screens are now tabbed.</strong> One long scroll became a collapsing hero plus a pinned tab bar.</li>'
      + '<li><strong>A Property Drive.</strong> Every document filed against a listing on the web is now readable in the app.</li>'
      + '<li><strong>Update gates.</strong> A blocking one before login, a dismissible nudge after it.</li>'
      + '<li><strong>Delete my account.</strong> Required by the app stores, for both agents and clients.</li>'
      + '<li><strong>Fingerprint sign-in</strong>, and Ellie now asks for the microphone properly.</li></ul>'
      + '<p>Status labels also read differently: <code>under_offer</code> now renders as <strong>Under Offer</strong>. More on that in chapter 6.</p>' }
]},

{ group:'Getting started', n:2, title:'Signing in — and the agent/client cascade', steps:[
  { t:'One login, two apps',
    go:toScreen('login'),
    target:'[data-in="login-email"]',
    coach:{ t:'Start here', b:'One email field decides which of the two apps you get.' },
    body:'<p>The backend decides which experience you get. When you press <strong>Continue to your workspace</strong>, the app tries in order:</p>'
      + '<ul><li>Log you in as an <strong>agent</strong>. If that works, you land on Agent Home.</li>'
      + '<li>If the password was wrong (a 401), it stops and says <em>“Incorrect password.”</em> It does not go hunting further.</li>'
      + '<li>Otherwise it looks the email up as a <strong>client</strong>: not found, found-but-never-activated, or active.</li></ul>'
      + '<p>That cascade is why an unknown email produces a client-shaped error, not an agent one.</p>'
      + '<div class="try">' + icon('help') + '<div>Try it: type anything into the email field and press Continue to see the unknown-email error, then use the two demo buttons at the bottom.</div></div>' },
  { t:'Creating an account is now the QR route',
    go:toScreen('login'),
    body:'<p>The secondary button used to say “Scan agent QR”. In 1.0.10 it reads <strong>Create your account</strong>, with the helper line <em>“New client? Create your account by scanning your agent’s QR.”</em></p>'
      + '<p>Nothing about the flow changed — it was reworded so app reviewers (and clients) can see there is a way to create an account from the login screen. It is still the growth loop: an agent shows their QR, a prospect scans it, and they arrive already attached to that agent.</p>'
      + '<p>The unknown-email error was reworded to match: <em>“We couldn’t find that email. Ask your agency to add you, or create your account by scanning your agent’s QR code.”</em></p>' }
]},

{ group:'Getting started', n:3, title:'Fingerprint sign-in', steps:[
  { t:'The one-time offer',
    go:function(){ S.biometricEnabled = false; S.biometricOffered = false; S.biometricAvailable = true;
      S.sessionLost = false; S.stack=[]; S.screen='login'; S.overlay=null; render();
      setTimeout(function(){ dialog('enable-biometric'); }, 200); },
    body:'<p>After your <strong>first successful password sign-in</strong>, the app offers once to turn on fingerprint unlock:</p>'
      + '<div class="callout new"><b>Use your fingerprint to sign in?</b><br>Unlock CoreX with your fingerprint next time instead of typing your password.<br><br>[ Not now ]  [ Enable ]</div>'
      + '<p>Say Enable and a secondary <strong>Unlock with fingerprint</strong> button appears on the login screen from then on. If the enrolment fails for any reason, you get a snackbar — <em>“Biometric sign-in wasn’t enabled. You can turn it on in Settings.”</em> — and nothing breaks.</p>'
      + '<p>In <strong>Settings → Security</strong> the row is called <strong>Fingerprint sign-in</strong>, or <strong>Fingerprint not available</strong> on a device without a sensor.</p>'
      + '<div class="callout gotcha"><b>What people get wrong.</b> Fingerprint unlock re-uses a session that already lives on the device. If that session is gone — new phone, cleared data, a long absence — you get the hint block: <em>“Sign in with your password once to switch fingerprint sign-in back on — this device doesn’t have your session any more.”</em> That is not a bug. Sign in with the password once and it re-arms.</div>',
    ctl:[{ l:'Show the lost-session hint', a:'demo-session-lost' },
         { l:'Show the unlock button', a:'demo-bio-on' },
         { l:'Enrolment fails', a:'demo-bio-fail' },
         { l:'No sensor on this device', a:'demo-bio-unavailable' }] }
]},

{ group:'Getting started', n:4, title:'Keeping the app up to date', steps:[
  { t:'The blocking gate',
    go:function(){ S.forceUpdate = true; render(); },
    body:'<p>On launch and on <em>every</em> resume, the app asks the server whether the installed build is still supported. If it is below the minimum, this screen replaces the entire app. No back button, no dismiss — Android’s system back is swallowed.</p>'
      + '<p>It appears <strong>before the login screen</strong>, so a stale build cannot even reach your credentials.</p>'
      + '<div class="callout"><b>It fails open.</b> The gate is driven by a server <code>min_build</code>. If the check errors, times out, or no update URL is configured for the platform, you are let straight through. A broken config must never lock an agency out of their own app. Once it does latch on, it stays on for the session — it never flickers off mid-use.</div>'
      + '<p>The line at the bottom — <strong>Installed: 1.0.10 (18)</strong> — is the version name and the build number. Support asks for that line, because <code>min_build</code> compares against the number in brackets, not the dotted version.</p>'
      + '<p>An operator can replace the body text with a custom message during an incident. The default reads: <em>“This version of CoreX is no longer supported. Update to the latest version to carry on.”</em></p>'
      + '<h4>Where “Update now” goes</h4>'
      + '<p>Both update screens hand off to the store listing. In this guide those buttons are live — they open the real CoreX OS page on Google Play in a new tab:</p>'
      + '<p>' + storeLink('btn2 sm', 'Get CoreX OS on Google Play', true) + '</p>'
      + '<p class="t12t" style="font-size:12px;word-break:break-all">' + esc(APP.playStore) + '</p>',
    ctl:[{ l:'Show the gate', a:'trigger-force-update' }, { l:'Back to the app', a:'dismiss-force-update' }] },
  { t:'The optional nudge',
    go:function(){ S.forceUpdate = false; S.updateDialogSeen = false; S.side='agent'; S.stack=[]; S.screen='home'; S.overlay=null; render();
      setTimeout(function(){ dialog('update-available'); }, 200); },
    body:'<p>A separate dial — <code>latest_build</code> — drives a much softer prompt. It is a <strong>dismissible dialog</strong>, it only ever appears once you are already inside the app, and it shows <strong>once per release</strong>.</p>'
      + '<p>Tapping <strong>Later</strong> (or tapping outside the dialog) snoozes it against that build number. It will not ask again until a genuinely newer build ships.</p>'
      + '<div class="callout new"><b>The two are mutually exclusive.</b> Forced is terminal and lives before authentication. Optional is dismissible and lives inside the app. You will never see both, and you will never see the optional one on the login screen.</div>'
      + '<p><code>min_build</code> and <code>latest_build</code> are independent. It is normal for the latest build to sit well above the minimum — that is the gap between “we would like you to update” and “you must”.</p>',
    ctl:[{ l:'Show the dialog again', a:'trigger-update-dialog' }] }
]},
